const CYBER_UNIT={id:"it2c",code:"IT U2",title:"Cyber Security & Incident Management",assess:"Exam · 2h 15m · 90 marks",exam:true,
notes:[
{h:"A1.1 Internal threats",b:[
"Internal threats come from **inside** the organisation and can be **deliberate (sabotage)** or **accidental**.",
"**Theft or loss**: stealing hardware to sell, a laptop left on a train, a disgruntled employee damaging a server, a rival bribing staff for a client list, misusing **software licences**.",
"**Accidental or deliberate damage**: fire, flood, power loss, terrorism, extreme weather and other disasters. Think about these when choosing where to build a data centre.",
"**Unauthorised software** can break licence rules (fines), be incompatible, slow systems or bypass security and monitoring software.",
"**Weak security / unsafe practices**: fix with door locks, passwords, **security vetting** of visitors, and blocking untrustworthy websites.",
"**Accidental disclosure**: train staff, report all potential breaches, build a security culture, and **lock leavers' accounts immediately**."]},
{h:"A1.2.1 Malware: viruses",b:[
"**Malware** is any software written with malicious intent; a **virus** is one type of malware that attaches to files and spreads.",
"**Boot sector**: infects files needed to boot the OS, so the device won't start (spread by USB sticks, downloads).",
"**Web script**: hides in web pages, adverts and pop-ups and steals usernames and passwords. **Macro**: embedded in Word/Excel macros; alters or deletes files.",
"**Rootkit**: lets criminals take **full remote control** of a computer. **Worm**: spreads **on its own** with no human action. **Trojan**: disguised as a genuine program.",
"**Browser hijacker**: changes homepage/search settings and redirects to malicious sites. **Polymorphic**: **changes its code/appearance** to avoid antivirus detection. **Resident (TSR)**: hides in **memory** to dodge scans."]},
{h:"A1.2.1 Spyware, adware, ransomware & bots",b:[
"**Adware**: excessive pop-ups. Types: **PUPs** bundled with free software, legitimate, **abusive** and **deceptive** adware (hard to remove).",
"**Spyware** collects data without consent: **keyloggers** (record keystrokes for passwords/PINs), **system monitors** (screenshots, sites, emails), **trackers**, **stalkerware**, **web beacons**, **tracking cookies**.",
"Monitoring/tracking is only illegal **without consent**: the same tools can be used legitimately.",
"**Ransomware** demands payment: **encryptors** (encrypt files, sell the key), **lockers** (lock the device), **scareware** (fake virus warnings), **leakware/doxware** (threatens to publish data).",
"**Bots** perform automated tasks (spam, scanning, data gathering); many bots across many machines form a **botnet**."]},
{h:"A1.2.2–A1.2.3 Hacking & sabotage",b:[
"**Hacking** = gaining unauthorised access to a computer or data without the owner's permission.",
"**DoS** floods one machine (often a web server) with traffic so it crashes. **DDoS** uses a **botnet** of many compromised computers to attack from many locations.",
"**Cyberwarfare**: **espionage** (stealing secrets), **sabotage**, **economic attacks**, **infrastructure attacks** (transport, communications).",
"**Data theft** (copy or remove data) and **data tampering**: **back-end** (editing a database) vs **front-end** (defacing a website).",
"**Sabotage** includes **data destruction**, **fakes/deepfakes**, **data poisoning** (corrupting AI training data) and **targeted damage/hijacking** of IoT, autonomous devices, industrial processes and **critical national infrastructure** (energy, water, communications, transport)."]},
{h:"A1.2.4 Social engineering",b:[
"Social engineering uses **persuasion and trust** to trick people into unsafe actions.",
"**Phishing** (email), **vishing** (voice/phone, sometimes AI voice deepfakes), **smishing** (SMS). Links lead to malware or fake login pages.",
"**Spear phishing** is **personalised** to a target (uses their name); **whaling** targets **high-value people** such as CEOs.",
"**DNS spoofing**: the attacker changes a DNS entry so a real domain points to a **fake website's IP address**, capturing logins.",
"**Pretexting** uses a made-up scenario to create **urgency/panic**; **impersonation** pretends to be someone else (e.g. the bank)."]},
{h:"A1.2.5 Physical security threats",b:[
"Physical security stops **unauthorised physical access**: locks, movement sensors, key cards and phones.",
"Ways around it: **tailgating** (following someone through a door), **forced entry**, **impersonation**, **coercion** (bribery, blackmail).",
"Device threats: **unattended devices**, **shoulder surfing** (watching screens/PINs), and **stealing access devices** such as cards or USB keys.",
"Lost mobile devices are a big risk if they hold sensitive data or are used for multi-factor authentication."]},
{h:"A1.3–A1.4 Impact of threats & the changing landscape",b:[
"**Operational loss**: manufacturing output, service availability, data availability (e.g. a supermarket can't sell without its price database).",
"**Financial loss**: lost sales, cash-flow problems, insurance costs; **compensation** and refunds; **legal liability**: **ICO fines up to £17.5 million**, investigation and legal fees.",
"**Reputational loss** (lost trust, bad reviews) and **intellectual property loss** (designs, trade secrets, strategy, test data).",
"Threats change over time (AI phishing, IoT, critical infrastructure attacks). Up-to-date advice: **NCSC** (UK, 2016, part of GCHQ; '10 Steps to Cyber Security'), **OWASP** (Top 10 web app risks), **NIST** (US standards, NICE, NCCoE)."]},
{h:"A2 Vulnerabilities, attack vectors & tools",b:[
"**Ports**: well-known 0–1023 (FTP 21, SMTP 25, HTTP 80, HTTPS 443), registered 1024–49151, dynamic 49152–65535. Attackers **scan for open ports**, **fingerprint** systems and **spoof** traffic through open ports.",
"**External storage** (USB, SD, external HDD/SSD) can be stolen or carry malware, so allow only authorised, encrypted devices.",
"Organisational fixes: **password policies** (length, no personal info, no sharing, lockouts), **password managers**, correct **permissions/privileges** (read/write/execute; user/admin/guest accounts).",
"Software/OS/IoT/cloud weaknesses: untrusted downloads (check HTTPS, trusted source, **hash check**, malware pre-scan), unpatched OS, **zero-day** flaws, **SQL injection**, default IoT passwords, weak encryption, third-party cloud providers.",
"**Attack vector** = method used to exploit a vulnerability; all vectors together = the **attack surface**. Wireless vectors: Wi-Fi eavesdropping/deauthentication, Bluetooth (**BlueSmacking, BlueJacking, BlueSnarfing, BlueBugging**), NFC relay/**skimming**, RFID cloning.",
"Tools: **port scanner** (open/closed/filtered), **network mapper**, **registry checker**, **website vulnerability scanner**, vulnerability management software, simulated phishing, **penetration testing**, third-party reviews.",
"Passive risk management: **transfer** (to a third party), **avoid** (stop the activity), **accept** (cheaper than preventing)."]},
{h:"A3 Legal responsibilities",b:[
"**UK GDPR / Data Protection Act 2018** principles: lawfulness, fairness & transparency; purpose limitation; **data minimisation**; accuracy; **storage limitation**; integrity & confidentiality (security); accountability.",
"Legal reasons to process data: **consent**, contract, **legitimate interest**, vital interests, legal obligation, public task/welfare.",
"Rights: to be informed, **access** (a copy), rectification, **erasure (right to be forgotten)**, restrict processing, **data portability**, object, and object to automated decisions/**profiling**.",
"**Computer Misuse Act 1990**: s1 unauthorised access (**up to 2 yrs**); s2 access with intent to commit further offences (**5 yrs**); s3 unauthorised acts to impair a computer, e.g. DoS (**10 yrs**); s3ZA serious damage, e.g. critical infrastructure (**14 yrs, life if national security**); s3A making/supplying tools such as a virus (**2 yrs**)."]},
{h:"A4.1 Security measures",b:[
"**Physical**: locks, card entry (NFC, RFID, QR, magnetic strip, chip), **biometrics**, CCTV, alarms, security staff, protected cabling, staff training.",
"**Backups**: **full**, **differential** (changed since the last *full*), **incremental** (changed since the last backup of *any* type). Decide onsite/offsite/cloud and automated/manual.",
"**RAID** mirrors disks against hardware failure but is **not a backup** (deletions copy across). **Archiving** stores old data and isn't a backup. **Hot site** = ready with data; **warm site** = ready but data must be loaded.",
"Recovery: **file restore**, **image restore**, **full/bare-metal restore**. **Data resilience** = recovering quickly.",
"**Antivirus**: **signature** detection, **heuristics** for new threats, **checksums** to spot changed files; warn, log, block, **quarantine**, delete. **Firewalls**: packet filtering, rules for ports, blocking IPs, application awareness.",
"**Authentication**: login, password policy, biometrics, **MFA** (knowledge, possession, inherence, location, behaviour), **security tokens**, **Kerberos**, key exchange, **certificate-based** (TLS, PKI, Certificate Authority).",
"**Access control**: **DAC** (users control their own files), **RBAC** (by job role), **RuBAC** (admin-set rules). Plus trusted computing, device tracking (GPS, phone-home), screen lock, lockout after failed logins, **remote wipe**."]},
{h:"A4.2–A4.4 Encryption & protecting a WLAN",b:[
"Storage encryption: safe password storage, **DRM**, file/folder/disk/device encryption.",
"**Symmetric** = one shared key (e.g. **AES**); **asymmetric** = public + private key (e.g. **RSA**, used for digital signatures). **Diffie–Hellman** lets two parties agree a shared secret key.",
"Communication: **HTTPS**, **VPN** (encrypted tunnel, hides IP), **E2EE** (even the provider can't read it), TOR, digital certificates.",
"WLAN protection: **WPA2/WPA3** (AES; WPA3 is newer and stronger), **WPS** (easy setup, home only), **MAC filtering** (allow/block lists), **hide the SSID**, change default router passwords, VPNs, firewalls.",
"Wireless threats: **unsecured access points** (sniffing), **piggybacking**, **evil twin / fake access point**.",
"Secure design: **least privilege ('fewest privileges')**, assume the design becomes public, don't rely on secrecy, comply with **ISO 27000**, expect attacks and plan for them."]},
{h:"B1 Networks, topologies & trends",b:[
"Types: **LAN**, **WLAN**, **WAN** (the internet is a WAN), **SAN** (dedicated shared storage), **PAN**. Private: **intranet**, **extranet**, cloud network.",
"Considerations: IEEE 802 standards, scalability, IP and Wi-Fi channel admin, sharing, performance, backups, security settings, reliability, **fault tolerance**. Diagrams are **physical** (layout) or **logical** (IPs, ports, IDs).",
"Physical topologies: **star** (central switch; most common), **extended star**, **mesh** (robust; the internet), **wireless mesh**, **hierarchical/tree**, **ad-hoc** (direct, e.g. tethering). Logical: **bus** (broadcast) and **ring** (passed node to node).",
"Architecture: **peer-to-peer** (no server), **client/server**, **thin client** (server does all processing).",
"Trends: **virtualisation** (VMs), **segmentation**, isolation/**sandboxing**/containerisation (smaller attack surface, easy recovery), **SDN**, cloud risks (misconfiguration, APIs, account hijacking, provider reliance), **IoT** (weak defaults, Zigbee/Bluetooth, botnets), **BYOD** (passwords, privacy, updates, apps, wiping, tracking), remote working."]},
{h:"B2–B3 Network components & infrastructure",b:[
"Devices: **switch** (forwards to the right device), **router** (joins networks), **gateway** (joins networks with **different protocols**), **bridge** (joins/segments LANs), **repeater** (boosts signal), **access point** (wireless to wired), **modem** (DSL/fibre/wireless), USB hub.",
"Media: NFC (≈4 cm, often unencrypted), Bluetooth (≈10 m), cellular/5G, **optical fibre** (fast, no electrical interference), Li-Fi, Ethernet (RJ45), USB, Wi-Fi 802.11.",
"External media risks: loss/theft, interception, corruption, lifespan, malware vector. Controls: **encryption** and **secure disposal**.",
"Software: GUI, CLI and web interfaces; monitoring tools (remote access, performance monitors, **event logs**, vulnerability scanners, **packet sniffers**); centralised vs **distributed** databases.",
"**TCP/IP** 4 layers: **application** (HTTP, SMTP, FTP), **transport** (TCP), **internet** (IP), **network access** (Ethernet). **TLS** adds encryption, authentication and integrity. Packets have a **header** (addresses, sequence), **payload** and **trailer** (error check). **TCP** acknowledges; **UDP** doesn't (fast streaming/gaming).",
"**NAT** (static, dynamic, **PAT**) hides private IPs. **IPv4** = 32 bits; **IPv6** = 128 bits. Private ranges: **10.x**, **172.16–31.x**, **192.168.x**; APIPA 169.254.x; loopback 127.0.0.1.",
"Domains: **domain controllers**, subdomains, trust relationships. Benefits: limits access, restricts lateral movement, smaller attack surface.",
"Services: **DNS** (name → IP, caching, reverse lookup), **directory services** (Active Directory, LDAP), authentication (2FA, MFA, **SSO**; **PAP** unencrypted, **CHAP** challenge, **EAP** framework), **DHCP** (ranges, leases, reservations, default gateway), routing (IGP, EGP, BGP), VPN remote access, file/print, web, email (SMTP, POP, MIME), VoIP, SMS, video conferencing, CaaS."]},
{h:"C1 Internal policies",b:[
"Cyber security policy follows **Plan–Do–Check–Act** from **ISO 27001**.",
"**Internet/email policy**: no inappropriate or illegal content, protect confidential info, no copyrighted downloads, no unauthorised executables, users are monitored.",
"**Password policy**, staff responsibilities, **training policy** (all staff, inclusive, tracked, updated), **security audits**.",
"**Backup policy**: what's critical, backup type, media, offsite, timing, who's responsible, testing, legal compliance, recovery procedure.",
"**Data protection policy** (Data Protection Officer, training, third parties). **Incident response**: contacts, roles (response leader, IT, senior management, **legal**, **PR**, HR, insurance), **triage**, escalation, containment, recovery, review.",
"**Disaster recovery**: purpose and scope, triage list, activate incident response / **business continuity** / disaster recovery plans, roles, monitoring. Plus **external services** policies (cloud, suppliers, support agreements, response times, escalation)."]},
{h:"D1–D2 Digital forensics",b:[
"**Confiscate** suspect devices straight away; collect passwords, chargers and power; isolate from networks; photograph screens.",
"**Live forensics** examines a running system: risk of changing data, anti-forensic software and running malware, but **RAM is volatile** and temporary data is lost on shutdown. Otherwise power off, remove batteries, use a **Faraday cage**, package it and record custody.",
"Work on a **disk image (clone)**, not the original. Review user files and settings, **system logs**, **user activity** (browsing, cookies, recent files, email) and malware alerts.",
"**Network forensics**: get the owner's permission; **passive** tools (analyse logs/traffic) vs **active** tools (may disrupt). Check firewall, router and WAP logs.",
"Document the scene: secure it; photos, plans and video; **contemporaneous notes**; **witness statements**.",
"Systematic analysis: compare with a clean image, **hash/checksum** files, snapshots (boot sector, RAM, processes, network info, temporary and deleted files, system files).",
"Reliability: don't change data, competent investigator, **chain of custody**, log every action, justify any alteration. Visual evidence: photos, screenshots, **timestamps**, **metadata**. Avoid **false positives** and **alert fatigue**.",
"Findings: crime, regulatory breach or civil liability? Signs of compromise: unusual traffic, logins, DNS requests, file reads or changes, port use. The **security report** covers title/date, contents, introduction, analysis (errors, omissions, unforeseen problems), conclusions and recommendations."]}
],

exam:[
{q:"Explain why a polymorphic virus is hard to detect.",m:2,cmd:"Explain",pts:["It changes its code/appearance/behaviour each time it spreads (1)","so antivirus software can't match it against a known signature (1)"]},
{q:"State three steps that are normally part of a ransomware attack.",m:3,cmd:"State",pts:["Malware is delivered/installed, e.g. via a phishing email or infected download (1)","Files are encrypted / the device is locked (1)","A ransom demand is made, often in cryptocurrency, for the decryption key (1)"]},
{q:"Explain what the goal of a phishing attack is.",m:3,cmd:"Explain",pts:["To trick the user into trusting a fake message that appears to come from a legitimate source (1)","so they click a link/attachment or reveal credentials such as usernames, passwords or bank details (1)","which the criminal then uses to steal money/data or install malware (1)"]},
{q:"Describe an example of an impersonation attack and state one piece of advice to avoid one.",m:3,cmd:"Describe",pts:["A criminal pretends to be someone trusted, e.g. calls claiming to be from the bank or IT helpdesk (1)","and asks the victim to confirm a security code/password or grant access (1)","Advice: hang up and contact the organisation on a known official number / never share codes (1)"]},
{q:"A new dental surgery is adding Wi-Fi for patients in its waiting area. Explain two precautions it should take to protect its wireless network.",m:4,cmd:"Explain",pts:["Use WPA3/WPA2 with a strong password (1) so traffic is encrypted and can't be read by eavesdroppers (1).","Put patient Wi-Fi on a separate segment/guest network from the medical records network (1) so a breach can't spread laterally (1).","Change default router credentials / use MAC filtering for staff devices (1) so attackers can't easily access settings or connect (1)."]},
{q:"Explain the difference between a differential and an incremental backup.",m:4,cmd:"Explain",pts:["A differential backup copies all files changed since the last full backup (1)","so restoring needs only the full backup plus the latest differential (1)","An incremental backup copies only files changed since the last backup of any type (1)","so backups are smaller/faster but a restore needs the full backup plus every incremental (1)"]},
{q:"Identify which section of the Computer Misuse Act 1990 each action breaks: (a) installing ransomware at a national water treatment centre; (b) an employee reading a colleague's emails after guessing their password; (c) writing a virus and sharing it online.",m:3,cmd:"State",pts:["(a) Section 3ZA: unauthorised acts causing serious damage, e.g. to critical national infrastructure (1)","(b) Section 1: unauthorised access to computer material (1)","(c) Section 3A: making/supplying articles for use in computer misuse offences (1)"]},
{q:"Explain two issues that should be covered in an internet and email policy.",m:4,cmd:"Explain",pts:["No downloading/running unauthorised executables or visiting dangerous sites (1) because these could introduce malware to the network (1).","Care when sending confidential information internally and externally (1) to prevent data breaches and GDPR fines (1).","Users will be monitored (1) so staff know acceptable use is enforced and misuse can be investigated (1)."]},
{q:"Explain why working with a live device can be challenging for a forensic investigator.",m:4,cmd:"Explain",pts:["Background processes keep changing data (1), so evidence could be altered/contaminated (1).","Malware or anti-forensic software may still be running (1) and could destroy evidence when triggered (1).","But if powered off, volatile RAM data (live processes, network connections) is lost (1), so investigators must capture it carefully first (1)."]},
{q:"Describe three network-based signs that could show a system has been compromised.",m:3,cmd:"Describe",pts:["Unusual inbound/outbound traffic, e.g. to unusual countries or very high volumes (DoS/DDoS) (1)","Unusual login attempts in number or origin (1)","Unusual DNS requests to non-existent domains / unusual port usage flagged by the firewall (1)"]},
{q:"Explain one advantage and one disadvantage of using multi-factor authentication.",m:4,cmd:"Explain",pts:["Advantage: even if a password is stolen, the attacker also needs another factor such as the user's phone or fingerprint (1), so accounts are much harder to break into (1).","Disadvantage: slower/less convenient logins, or users locked out if they lose their phone/token (1), which can reduce productivity or increase help-desk costs (1)."]},
{q:"Evaluate the use of BYOD (bring your own device) in a modern organisation.",m:9,cmd:"Evaluate",pts:["For: lower hardware costs; staff are familiar with their own devices; flexibility and remote working; can improve productivity and morale.","Against: weak home passwords; personal and organisational data mixing (privacy); missing updates/patches; risky personal apps; lost/stolen devices; compatibility issues.","Controls: apply the password policy to all devices, mobile device management, monitoring/tracking with consent, segmentation or SAN access controls, encryption and certificates, remote wipe when staff leave.","Weighs up whether the benefits outweigh the security risks in context.","Level 3 (7–9): balanced, well-applied discussion with a supported conclusion, e.g. BYOD is worthwhile only with strong policies and technical controls."]},
{q:"Assess the importance of staff training in protecting an organisation from cyber threats.",m:9,cmd:"Assess",pts:["Humans are often the weakest point: phishing, social engineering, weak passwords, accidental disclosure, tailgating.","Training builds a security culture: reporting suspicious activity, spotting phishing, physical security habits; simulated phishing tests measure progress.","Training alone isn't enough: technical controls (firewalls, MFA, encryption, patching, backups) and policies are also needed.","Needs to be regular, inclusive, tracked and updated as threats change (training policy).","Supported judgement on how important it is relative to other measures."]}]

notes:[
{h:"Purpose & principles of websites",b:[
"Websites can **inform**, **sell (e-commerce)**, **promote**, **entertain**, **educate** or support **social interaction**. Start from the **client requirements** and the **target audience**.",
"**Usability**: easy navigation, consistent layout, readable text, fast loading, clear calls to action.",
"**Accessibility** (WCAG): **alt text** on images, good **colour contrast**, keyboard navigation, captions, resizable text, meaningful link text.",
"**Front end** = what runs in the browser (HTML, CSS, JavaScript). **Back end** = server-side code and databases.",
"**SEO** (search engine optimisation): meaningful **title** and **meta description**, headings, keywords, fast pages, mobile-friendly design."]},
{h:"How the web works",b:[
"**Client–server model**: the browser (client) requests pages; the **web server** sends them back.",
"**DNS** turns a domain name (e.g. example.com) into an **IP address**.",
"**HTTP/HTTPS** transfers pages; HTTPS encrypts the data with TLS.",
"**Web hosting** stores the site on a server; choices include shared hosting, VPS and cloud hosting.",
"Browsers render pages differently, so test in several (**cross-browser compatibility**)."]},
{h:"HTML",b:[
"HTML gives **structure** using tags: `<h1>`–`<h6>`, `<p>`, `<a href>`, `<img src alt>`, `<ul>/<ol>/<li>`, `<table>`, `<form>`.",
"**Semantic elements** describe meaning: `<header>`, `<nav>`, `<main>`, `<section>`, `<article>`, `<footer>`. They help accessibility and SEO.",
"$ <!DOCTYPE html>\n<html lang=\"en\">\n  <head><title>My Site</title></head>\n  <body>\n    <h1>Welcome</h1>\n    <img src=\"logo.png\" alt=\"Company logo\">\n  </body>\n</html>",
"Validate HTML with the **W3C validator** to find errors."]},
{h:"CSS",b:[
"CSS controls **presentation**: colours, fonts, layout. Keep it in an **external stylesheet** so every page shares one style.",
"Selectors: element (`p`), **class** (`.menu`), **id** (`#header`). Classes can be reused; an id is unique per page.",
"**Box model**: content → padding → border → margin.",
"**Responsive design**: flexible layouts (flexbox/grid) and **media queries** so pages work on phones, tablets and desktops.",
"$ @media (max-width: 600px) {\n  nav { display: none; }\n}"]},
{h:"JavaScript & interactivity",b:[
"JavaScript adds **interactivity**: responding to **events** (click, submit), changing the page through the **DOM**, form **validation**, image sliders.",
"$ document.getElementById(\"btn\").addEventListener(\"click\", () => {\n  alert(\"Thanks!\");\n});",
"Client-side validation gives instant feedback, but the server must still check data for security."]},
{h:"Design, testing & legal",b:[
"Design documents: **site map** (page structure), **wireframes/storyboards** (layout), **test plan**, asset list.",
"File formats: **JPEG** (photos, lossy), **PNG** (transparency, lossless), **SVG** (scalable vector), **GIF** (simple animation). Optimise images for speed.",
"Testing: functionality (links, forms), **usability** testing with users, cross-browser and mobile testing, accessibility checks, validation.",
"Legal: **copyright** (only use assets you have rights to), **UK GDPR** (personal data from forms), **PECR** (cookie consent), **Equality Act 2010** (accessibility)."]}
],

{id:"b8",code:"BUS U8",title:"Recruitment & Selection",assess:"Assignment · internal",exam:false,
notes:[
{h:"Why recruitment matters",b:[
"Effective recruitment brings in staff with the right **skills and attitudes**, improving productivity, customer service and **business success**.",

function merge(a,b){
  const out={cards:{},quiz:{},exam:{},wrong:{},topics:{},tests:{},days:{},updated:Math.max(a.updated||0,b.updated||0)};
  for(const k of ["cards","exam","wrong","topics","tests"]){
    const A=a[k]||{},B=b[k]||{};
    new Set([...Object.keys(A),...Object.keys(B)]).forEach(id=>{const x=A[id],y=B[id];out[k][id]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x)});
  }
  const QA=a.quiz||{},QB=b.quiz||{};
  new Set([...Object.keys(QA),...Object.keys(QB)]).forEach(id=>{
    const x=QA[id]||{},y=QB[id]||{},later=(y.t||0)>(x.t||0)?y:x;
    out.quiz[id]={best:Math.max(x.best||0,y.best||0),last:later.last,n:Math.max(x.n||0,y.n||0),t:later.t||0}});
  const DA=a.days||{},DB_=b.days||{};
  new Set([...Object.keys(DA),...Object.keys(DB_)]).forEach(d=>out.days[d]=Math.max(DA[d]||0,DB_[d]||0));
  const GA=a.gone||{},GB=b.gone||{};out.gone=Object.assign({},GA);for(const k in GB)out.gone[k]=Math.max(GA[k]||0,GB[k]||0);
  return out;
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}

function save(){
  P.updated=Date.now(); persistLocal(); updateTop();

}
async function flush(){
  if(!docRef||writing||!dirty) return;
  writing=true; dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(P)));setSync("on","Synced to your account")}
  catch(e){if(e&&e.code==="unavailable"){dirty=true;setTimeout(flush,1500+Math.random()*1500)}else setSync("","Not synced — saved on this device")}
  writing=false; if(dirty) flush();
}
function packsCol(){
  if(DB&&UID)return DB.collection("data/users/"+UID);
  if(typeof CLOUD!=="undefined"&&CLOUD.packs)return {doc:id=>({set:p=>CLOUD.packs.doc(id).set({json:JSON.stringify(p)}),delete:()=>CLOUD.packs.doc(id).delete()})};
  return null}
async function initRuntime(){
  if(!window.claude||!window.claude.use) return;
  claude.use("sample").then(async s=>{SAMPLE=s;if(s){try{LIMITS=await s.limits()}catch(e){LIMITS=null}} if(view.name==="import")render()});
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    DB=db; UID=uid; docRef=db.doc("data/users/"+uid+"/progress");
    setSync("busy","Syncing…");
    const snap=await docRef.get();
    if(snap.exists){P=merge(P,snap.data());persistLocal()}
    dirty=true; await flush();
    // packs: union of remote + local-only
    try{
      const qs=await packsCol().get();
      const all=qs.docs.filter(d=>d.id.startsWith("pack-"));
      for(const d of all){if(P.gone[d.id]){try{await packsCol().doc(d.id).delete()}catch(e){}}}
      const remote=all.filter(d=>!P.gone[d.id]).map(d=>d.data());
      const ids=new Set(remote.map(p=>p.id));
      const localOnly=PACKS.filter(p=>!ids.has(p.id));
      for(const p of localOnly){try{await packsCol().doc(p.id).set(p)}catch(e){}}
      PACKS=[...remote.map(p=>JSON.parse(JSON.stringify(p))),...localOnly]; persistPacks();
    }catch(e){}
    docRef.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites) return;
      const d=s.data(); if((d.updated||0)<=P.updated) return;
      P=merge(P,d); persistLocal(); PACKS=PACKS.filter(p=>!P.gone[p.id]); persistPacks(); setSync("on","Synced to your account"); updateTop();
      if(view.name==="home") render();
    },()=>setSync("","Not synced — saved on this device"));
    updateTop(); if(view.name==="home"||view.name==="unit") render();
  }catch(e){docRef=null;setSync("","Saved on this device only")}
}

function customUnit(p){return {id:p.id,code:"MY SLIDES",title:p.title,assess:"Imported slides",exam:false,course:courseFor(p.courseId),notes:[],cards:[],quiz:[],exam:[],custom:p}}
function isTopic(p){return !p.unitId||(!BASE[p.unitId]&&!PACKS.some(x=>x.id===p.unitId))}
function unitsOf(c){return [...c.units,...PACKS.filter(p=>isTopic(p)&&courseFor(p.courseId).id===c.id).map(customUnit)]}

function getUnit(id){if(BASE[id])return BASE[id];const p=PACKS.find(x=>x.id===id&&isTopic(x));return p?customUnit(p):null}
function sources(u){
  const list=[]; if(!u.custom) list.push({id:u.id,notes:u.notes,cards:u.cards,quiz:u.quiz,exam:u.exam});
  (u.custom?[u.custom,...PACKS.filter(p=>p.unitId===u.id)]:PACKS.filter(p=>p.unitId===u.id)).forEach(p=>list.push({id:p.id,pack:p,notes:p.notes||[],cards:p.cards||[],quiz:p.quiz||[],exam:p.exam||[]}));

}

const $=s=>document.querySelector(s);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isDue(k){const r=P.cards[k];return !r||r.d<=Date.now()}
function unitStats(u){
  const cs=cardsOf(u);let mastered=0,due=0;
  cs.forEach(c=>{const r=P.cards[c.k];if(r&&r.b>=3)mastered++;if(isDue(c.k))due++});
  return {mastered,due,total:cs.length,pct:cs.length?Math.round(mastered/cs.length*100):0,quiz:P.quiz[u.id]};
}
function allDue(){return allUnits().flatMap(u=>cardsOf(u).filter(c=>isDue(c.k)))}
function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addXP(n){if(!n)return;const k=dayKey();P.days[k]=(P.days[k]||0)+n;toast("+"+n+" XP")}
function totalXP(){return Object.values(P.days).reduce((a,b)=>a+b,0)}
function streak(){let n=0;const d=new Date();if(!P.days[dayKey(d)])d.setDate(d.getDate()-1);while(P.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function levelInfo(){const x=totalXP(),L=Math.floor(Math.sqrt(x/25))+1,lo=25*(L-1)**2,hi=25*L*L;return {x,L,toNext:hi-x,pct:Math.round((x-lo)/(hi-lo)*100)}}

function rateCard(c,ok){

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas");cv.id="confetti";document.body.appendChild(cv);
  const ctx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight,cs=getComputedStyle(document.documentElement);
  const cols=["--it","--biz","--soton","--gold","--hot"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(++t<90)requestAnimationFrame(f);else cv.remove()})();
}

  const tabs=[["notes","📖","Notes"],["cards","🃏","Cards"],["quiz","⚡","Quiz"],["exam","📝","Test"]];

function noteHTML(notes){return notes.map((n,i)=>`<article class="note"><h3><span class="n">${String(i+1).padStart(2,"0")}</span>${esc(n.h)}</h3><ul>${n.b.map(x=>

function tabNotes(u,el){
  let h=`<div class="legend"><span><b class="kt">Highlighted</b> = key terms · boxed = formulas &amp; code</span>${IN_CLAUDE?`<button class="btn small" id="impHere">＋ Import slides here</button>`:""}</div>`;
  sources(u).forEach(s=>{
    if(s.pack){const p=s.pack;
      h+=`<div class="packhead" data-p="${p.id}"><span><b>📎 ${esc(p.title)}</b></span><span class="row"><span class="status">Imported ${new Date(p.created).toLocaleDateString("en-GB")}</span><button class="btn ghost small" data-del>Remove</button></span>

function tabCards(u,el){
  if(!view.sub){
    const s=unitStats(u), cs=cardsOf(u);
    el.innerHTML=`<div class="done"><div class="big">${s.due}</div><p>of ${s.total} cards due · ${s.mastered} mastered</p>
    <div class="row center"><button class="btn" id="dueOnly" ${s.due?"":"disabled"}>Study due cards</button><button class="btn ghost" id="allC">Study all ${s.total}</button></div>
    <p class="hint">Tap the card to flip. “Got it” brings it back in 1, 3, 7, 14, then 30 days. Keyboard: space flips, 1 = again, 2 = got it.</p></div>`;
    $("#dueOnly").onclick=()=>startCards(shuffle(cs.filter(c=>isDue(c.k))));
    $("#allC").onclick=()=>startCards(shuffle(cs));
    return;
  }
  cardSession(el);
}
function newSession(deck){return {deck,n:deck.length,pos:0,flipped:false,right:0,missed:new Set()}}
function startCards(deck){view.sub=newSession(deck);renderUnit()}
function startReview(deck){view={name:"review",sub:newSession(deck)};render();scrollTo(0,0)}
function renderReview(){
  app.innerHTML=`<section class="imp-h"><div class="eyebrow">All courses</div><h1>Due card review</h1></section><div class="panel" id="panel"></div>`;
  cardSession($("#panel"));
}
function cardSession(el){
  const S=view.sub;
  if(S.pos>=S.deck.length){
    el.innerHTML=`<div class="done"><div class="big">${S.right}/${S.n}</div><p>known first time this round</p>
    <button class="btn" id="fin">${view.name==="review"?"Back home":"Back to cards"}</button></div>`;
    if(S.n&&S.right/S.n>=.7)confetti();
    $("#fin").onclick=()=>{if(view.name==="review")go({name:"home"});else{view.sub=null;renderUnit()}};
    return;
  }
  const c=S.deck[S.pos];
  if(view.name==="review")setC(c.u);
  el.innerHTML=`<div class="fc-top"><span class="count">${Math.min(S.pos+1,S.n)} / ${S.n}${S.deck.length>S.n?` (+${S.deck.length-S.n} retry)`:""}</span><span class="track"><i style="width:${Math.round(S.pos/S.deck.length*100)}%"></i></span><span class="count">${esc(c.u.code)}</span></div>
  <button class="flip ${S.flipped?"flipped":""}" id="card" aria-label="${S.flipped?"Answer showing, tap to flip back":"Tap to reveal answer"}"><span class="flip-inner">
    <span class="face front"><span class="side">${c.pack?"📎 From your slides":"Term / question"}</span><span class="big">${esc(c.f)}</span><span class="from">tap to flip</span></span>
    <span class="face back"><span class="side">Answer</span><span>${esc(c.b)}</span></span>
  </span></button>
  <div class="fc-actions" ${S.flipped?"":"hidden"}><button class="again" id="ag">Again</button><button class="gotit" id="ok">Got it ✓</button></div>
  ${S.flipped?"":`<p class="hint">Think of the answer, then tap the card</p>`}`;
  $("#card").onclick=()=>{S.flipped=!S.flipped;
    $("#card").classList.toggle("flipped",S.flipped);el.querySelector(".fc-actions").hidden=!S.flipped;const h=el.querySelector(".hint");if(h)h.remove()};
  $("#ag").onclick=()=>{S.missed.add(c.k);rateCard(c,false);S.deck.push(c);next()};
  $("#ok").onclick=()=>{rateCard(c,true);if(!S.missed.has(c.k))S.right++;next()};
  function next(){S.pos++;S.flipped=false;cardSession(el)}
}

function cardQuestions(u,n){
  const cs=cardsOf(u);if(cs.length<4)return [];
  let pool=cs;if(pool.length<4)pool=u.course.units.flatMap(cardsOf);
  return shuffle(cs).slice(0,n).map(c=>{
    const others=shuffle(pool.filter(o=>o.k!==c.k));
    const termFirst=!/^[\d−(-]/.test(c.f)&&c.f.length<45&&Math.random()<.5;
    if(termFirst){
      const ds=others.map(o=>o.f).filter(f=>f!==c.f).slice(0,3);
      return {k:"gen:"+hashStr("t"+c.k),tp:tagText(u,c.f+" "+c.b),raw:[`Which term matches this?\n“${c.b}”`,[c.f,...ds],0,`${c.f}: ${c.b}`]};
    }
    const ds=others.map(o=>o.b).filter(b=>b!==c.b).slice(0,3);
    return {k:"gen:"+hashStr("d"+c.k),tp:tagText(u,c.f+" "+c.b),raw:[c.f+(/[?…]$/.test(c.f)?"":" — which is right?"),[c.b,...ds],0,`${c.f}: ${c.b}`]};
  }).filter(q=>q.raw[1].length===4);
}
function bankQuestions(u){const out=[];sources(u).forEach(s=>s.quiz.forEach((q,i)=>out.push({k:"bank:"+s.id+":"+i,tp:tagText(u,q[0]+" "+q[1][q[2]]+" "+(q[3]||"")),raw:q})));return out}
function buildQuiz(u,total=12){
  const gens=MATHGEN[u.id]||[],out=[],stems=new Set();
  const add=q=>{if(q&&!stems.has(q.raw[0])&&out.length<total){stems.add(q.raw[0]);out.push(q)}};
  if(gens.length){
    const gi=gens.map((g,i)=>[g,i]);shuffle(gi).concat(shuffle(gi)).slice(0,6).forEach(([g,i])=>{try{const raw=g();add({k:"gen:"+hashStr(raw[0]),tp:genTopic(u,"q",i,raw[0]),raw})}catch(e){}});
    shuffle(bankQuestions(u)).slice(0,3).forEach(add);
  }else shuffle(bankQuestions(u)).slice(0,6).forEach(add);
  cardQuestions(u,total).forEach(add);
  shuffle(bankQuestions(u)).forEach(add);
  return shuffle(out).map(q=>({...q,u:u.id}));
}
function toSession(list){return list.map(q=>({k:q.k,u:q.u,tp:q.tp,raw:q.raw,s:q.raw[0],o:shuffle(q.raw[1].map((t,j)=>({t:String(t),c:j===q.raw[2]}))),e:q.raw[3]}))}
function liveWrong(filterU){return Object.entries(P.wrong||{}).filter(([k,w])=>w&&!w.fixed&&w.q&&(!filterU||w.u===filterU)).map(([k,w])=>({k,u:w.u,tp:w.tp,raw:w.q,n:w.n||1,t:w.t}))}
function recordAnswer(q,ok){
  P.wrong=P.wrong||{};const w=P.wrong[q.k];
  recordTopic(q.tp,ok);
  if(!ok)P.wrong[q.k]={u:q.u,tp:q.tp||null,q:q.raw,n:(w&&!w.fixed?w.n||1:0)+1,t:Date.now()};
  else if(w&&!w.fixed)P.wrong[q.k]=Object.assign({},w,{fixed:Date.now(),t:Date.now()});
}
(function prune(){const cut=Date.now()-60*DAY;for(const [k,w] of Object.entries(P.wrong||{}))if(w&&w.fixed&&w.fixed<cut)delete P.wrong[k]})();

function quizSession(el,S,onExit){
  if(S.pos>=S.qs.length){
    const pct=S.qs.length?Math.round(S.score/S.qs.length*100):0,left=S.qs.length-S.score;
    if(!S.saved){S.saved=true;
      if(S.mode==="quiz"){const old=P.quiz[S.unit]||{best:0,n:0};P.quiz[S.unit]={best:Math.max(old.best,pct),last:pct,n:old.n+1,t:Date.now()};S.newBest=pct>old.best&&old.n>0}
      save();if(pct>=70)confetti()}
    const tr=S.tid&&(P.topics||{})[S.tid];
    el.innerHTML=S.mode==="topic"
      ?`<div class="done"><div class="big">${S.score}/${S.qs.length}</div>${tr&&tr.on?`<p>Streak on this topic: ${dots(tr.s)} (${tr.s}/4 in a row)</p><p>Get 4 right in a row to clear it.</p>`:`<p><b>Topic cleared 🎉</b> It's off your list.</p>`}
        <div class="row center">${tr&&tr.on?`<button class="btn" id="again">Practise again</button>`:""}<button class="btn ghost" id="back">Done</button></div></div>`
      :S.mode==="quiz"
      ?`<div class="done"><div class="big">${pct}%</div><p>${S.score} of ${S.qs.length} correct${S.newBest?" · new best 🎉":""}</p>${left?`<p>${left} question${left>1?"s":""} added to <b>Mistakes</b>.</p>`:""}
        <div class="row center"><button class="btn" id="again">New quiz</button>${left?`<button class="btn" id="fix" style="--c:var(--bad)">Fix mistakes now</button>`:""}<button class="btn ghost" id="back">Done</button></div></div>`
      :`<div class="done"><div class="big">${S.score}/${S.qs.length}</div><p>mistakes fixed${left?` · ${left} still to fix`:" · all cleared 🎉"}</p>
        <div class="row center">${left?`<button class="btn" id="fix" style="--c:var(--bad)">Go again</button>`:""}<button class="btn ghost" id="back">Done</button></div></div>`;
    $("#back").onclick=onExit;
    const ag=$("#again");if(ag)ag.onclick=()=>{const u=getUnit(S.unit);Object.assign(S,{qs:toSession(S.mode==="topic"?topicQuestions(S.tid):buildQuiz(u)),pos:0,score:0,picked:null,combo:0,saved:false});quizSession(el,S,onExit)};
    const fx=$("#fix");if(fx)fx.onclick=()=>{const w=S.unit&&S.mode==="quiz"?liveWrong(S.unit):view.name==="mistakes"?liveWrong():liveWrong(view.id);
      Object.assign(S,{mode:"mistakes",qs:toSession(shuffle(w).slice(0,20)),pos:0,score:0,picked:null,combo:0,saved:false});quizSession(el,S,onExit)};
    return;
  }
  const q=S.qs[S.pos],L="ABCDEF",qu=getUnit(q.u);
  if(view.name==="mistakes"&&qu)setC(qu);
  el.innerHTML=`<div class="q"><div class="fc-top"><span class="count">${S.mode==="mistakes"?"❌ ":""}Q${S.pos+1} / ${S.qs.length}</span><span class="track"><i style="width:${Math.round(S.pos/S.qs.length*100)}%"></i></span><span class="combo">${S.combo>=2?"🔥 "+S.combo+" in a row":view.name==="mistakes"&&qu?esc(qu.code):""}</span></div>
  <p class="stem">${esc(q.s).replace(/\n/g,"<br>")}</p>
  <div class="opts">${q.o.map((o,j)=>{let cls="";if(S.picked!==null){if(o.c)cls="right";else if(j===S.picked)cls="wrong"}
    return `<button class="opt ${cls}" data-j="${j}" ${S.picked!==null?"disabled":""}><span class="k">${L[j]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
  ${S.picked!==null?`<div class="explain">${q.o[S.picked].c?(S.mode==="mistakes"?"<b>Fixed ✓</b>":"<b>Correct.</b>"):"<b class=\"x\">Not quite.</b>"} ${esc(q.e||"")}${!q.o[S.picked].c?`<br><span class="status">Saved to Mistakes</span>`:""}</div><div class="qnav"><button class="btn" id="nx">${S.pos+1<S.qs.length?"Next →":"See score"}</button></div>`:""}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.picked=+b.dataset.j;const ok=q.o[S.picked].c;recordAnswer(q,ok);
    if(ok){S.score++;S.combo++;addXP(S.mode==="mistakes"?8:5)}else S.combo=0;save();quizSession(el,S,onExit)});
  const nx=$("#nx");if(nx){nx.onclick=()=>{S.pos++;S.picked=null;quizSession(el,S,onExit)};nx.focus({preventScroll:true})}
}

function pruneTests(){const all=testsOf();all.slice(25).forEach(t=>{P.tests[t.id]={u:t.u,c:t.c,t:Date.now(),gone:1,status:t.status,score:t.score,max:t.max}})}
function aiAvailable(){return IN_CLAUDE?!!SAMPLE:!!FB_CFG}
function parseJSONLoose(s){s=String(s||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");try{return JSON.parse(s)}catch(e){}
  const a=Math.min(...["[","{"].map(c=>{const i=s.indexOf(c);return i<0?1e9:i})),b=Math.max(s.lastIndexOf("]"),s.lastIndexOf("}"));if(a<1e9&&b>a)return JSON.parse(s.slice(a,b+1));throw {code:"invalid_json"}}
let AIM=null;
async function getAIModel(){
  if(AIM)return AIM;
  if(window.__AI_MOCK)return AIM={mock:window.__AI_MOCK};
  const B="https://www.gstatic.com/firebasejs/12.19.0/";
  const appMod=await import(B+"firebase-app.js"),aiMod=await import(B+"firebase-ai.js");
  const app=appMod.getApps().find(a=>a.name==="ai")||appMod.initializeApp(FB_OPTS,"ai");
  if(FB_CFG.recaptchaSiteKey){try{const ac=await import(B+"firebase-app-check.js");ac.initializeAppCheck(app,{provider:new ac.ReCaptchaV3Provider(FB_CFG.recaptchaSiteKey),isTokenAutoRefreshEnabled:true})}catch(e){}}
  return AIM={ai:aiMod.getAI(app,{backend:new aiMod.GoogleAIBackend()}),getGenerativeModel:aiMod.getGenerativeModel};
}
async function geminiJSON(prompt){
  const M=await getAIModel();if(M.mock)return parseJSONLoose(await M.mock(prompt));
  const models=(FB_CFG.aiModels&&FB_CFG.aiModels.length)?FB_CFG.aiModels:["gemini-3.5-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite"];let last;
  for(const m of models){
    try{const model=M.getGenerativeModel(M.ai,{model:m,generationConfig:{responseMimeType:"application/json",temperature:0.2}});
      const r=await model.generateContent(prompt);return parseJSONLoose(r.response.text())}
    catch(e){last=e;if(!/not.?found|404|not supported|unsupported|no longer available|retired/i.test(String(e&&(e.message||e))))break}
  }
  throw last||{code:"upstream_error"};
}
async function aiJSON(prompt){

}
function markPrompt(t,items){
  const u=getUnit(t.u);
  return `You are an experienced examiner marking a student's written exam answers for: ${u?u.course.full+" — "+u.code+" "+u.title:"a UK sixth-form course"}.
Mark each answer fairly and consistently against its mark scheme, exactly as a real examiner would.
Rules:
- Only credit what is actually in the student's answer. Spelling mistakes don't lose marks unless the meaning is unclear.
- Calculations: credit each correct step in the mark scheme. A correct final answer with no working gets full marks unless working is clearly required.
- "Explain" points need a reason or consequence, not just a statement.
- For questions worth 9+ marks, or with command words Analyse, Assess, Evaluate, Discuss, Justify or "To what extent", use levels of response: knowledge, application to the context, developed chains of analysis, and (where asked) a supported judgement. Not all indicative content needs to appear.
- Be honest but encouraging. Write feedback to the student as "you".

${items.map(q=>`--- Question ${q.i+1} (${q.m} marks, command word: ${q.cmd}) ---
${q.q}
Mark scheme points:
${q.pts.map((p,j)=>`${j+1}. ${p}`).join("\n")}
Student's answer:
<<<
${String(q.ans).slice(0,4000)}
>>>`).join("\n\n")}

Reply with ONLY a JSON array with one object per question above, in this exact shape:
[{"q": <question number>, "score": <whole number from 0 to that question's marks>, "hit": [<numbers of the mark scheme points the answer earned>], "feedback": "<2-3 sentences: what was good and what was missing>", "tip": "<one specific thing to add next time>"}]`;
}
const MARKING=new Set();
async function markTest(id){
  if(MARKING.has(id))return "busy";const t=P.tests[id];if(!t||t.status!=="pending")return "done";
  MARKING.add(id);
  try{
    const items=t.qs.map((q,i)=>({i,...q})).filter(q=>String(q.ans||"").trim().length>=2);
    let res=[];
    if(items.length){res=await aiJSON(markPrompt(t,items));if(!Array.isArray(res))res=(res&&(res.results||res.questions||res.marks))||[]}
    const qs=t.qs.map((q,i)=>{
      if(String(q.ans||"").trim().length<2)return {...q,score:0,fb:"No answer given.",hit:[],tip:"Have a go at every question: even a definition can earn a mark."};
      const r=res.find(x=>+x.q===i+1);if(!r)throw {code:"invalid_json"};
      return {...q,score:Math.max(0,Math.min(q.m,Math.round(+r.score||0))),fb:String(r.feedback||""),tip:String(r.tip||""),hit:(Array.isArray(r.hit)?r.hit:[]).map(Number).filter(n=>n>=1&&n<=q.pts.length)};
    });
    const latest=P.tests[id];if(!latest||latest.status!=="pending")return "done";
    const score=qs.reduce((a,q)=>a+q.score,0),max=qs.reduce((a,q)=>a+q.m,0);
    P.tests[id]={...latest,qs,score,max,status:"marked",t:Date.now()};
    qs.forEach(q=>recordTopic(q.tp,q.m?q.score/q.m>=0.5:false));
    addXP(Math.max(2,score*2));pruneTests();save();
    return "ok";
  }finally{MARKING.delete(id)}
}

function markErrText(e){const c=e&&e.code;if(MARK_ERR[c])return MARK_ERR[c];const m=String(e&&(e.message||e)||"");

let pendingRun=false;

}

function addImages(files){

  drawAttach();drawGen();

async function handleFiles(files){
  const imgs=files.filter(f=>f.type.startsWith("image/")), decks=files.filter(f=>/\.pptx$/i.test(f.name));

  if(imgs.length){if(LIMITS&&LIMITS.images)addImages(imgs);else imp.msg="Images aren't supported here. Upload the .pptx file or paste the text."}
  for(const f of decks){
    try{const text=await readPptx(f);imp.pptx.push({name:f.name,text,slides:(text.match(/--- Slide /g)||[]).length})}
    catch(e){imp.msg=`Couldn't read ${f.name}. If it's an old .ppt file, save it as .pptx first.`}
  }
  if(other.some(f=>/\.ppt$/i.test(f.name)))imp.msg="Old .ppt files can't be read. In PowerPoint use File → Save As → .pptx, then upload that.";

async function readPptx(file){
  if(!window.JSZip) throw new Error("no zip");
  const zip=await JSZip.loadAsync(file);
  const A="http://schemas.openxmlformats.org/drawingml/2006/main";
  const txt=xml=>{const d=new DOMParser().parseFromString(xml,"application/xml");return [...d.getElementsByTagNameNS(A,"p")].map(p=>[...p.getElementsByTagNameNS(A,"t")].map(t=>t.textContent).join("")).filter(s=>s.trim()).join("\n")};
  const num=n=>+n.match(/(\d+)\.xml$/)[1];
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
  const out=[];
  for(const n of slides){
    const i=num(n); let notes="";
    const rels=zip.file(`ppt/slides/_rels/slide${i}.xml.rels`);
    if(rels){const m=(await rels.async("string")).match(/Target="\.\.\/notesSlides\/(notesSlide\d+\.xml)"/);
      if(m&&zip.file("ppt/notesSlides/"+m[1]))notes=txt(await zip.file("ppt/notesSlides/"+m[1]).async("string")).split("\n").filter(l=>!/^\d+$/.test(l.trim())).join(" ")}
    const t=txt(await zip.file(n).async("string"));
    if(t||notes) out.push(`--- Slide ${i} ---\n${t}${notes?`\n[Speaker notes] ${notes}`:""}`);
  }
  if(!out.length) throw new Error("empty");
  return out.join("\n\n");
}
function buildPrompt(){
  const t=imp.target, isNew=t.startsWith("new:"), course=isNew?COURSE[t.slice(4)]:getUnit(t).course, u=isNew?null:getUnit(t);
  return `You are turning a student's lesson slides into condensed revision material.
Student: UK sixth-form student doing ${course.full}. Topic: ${u?u.code+" "+u.title:(imp.newName||"(work it out from the slides)")}.
Goal: make the content quick and easy to learn. Compress hard: cut filler, repetition, titles and admin, but keep every examinable fact, definition, formula, process and example. Use short, plain sentences.
${imp.images.length?`${imp.images.length} slide image(s) are attached: read all text, diagrams and tables in them.\n`:""}Reply with ONLY one JSON object in exactly this shape:
{"title":"short topic title, max 6 words",
 "summary":"one-sentence TL;DR of the whole deck",
 "notes":[{"h":"section heading","b":["bullet","bullet"]}],
 "cards":[["front: a term or short question","back: answer in max 25 words"]],
 "quiz":[{"q":"question","options":["A","B","C","D"],"answer":0,"why":"one-sentence explanation"}],
 "exam":[{"q":"exam-style question","marks":4,"cmd":"Explain","points":["mark scheme point"]}]}
Rules: 3-7 note sections with 2-6 bullets each, each bullet max 30 words; wrap key terms in **double asterisks**; a bullet that is only a formula starts with "= ". 8-20 cards. 5-10 quiz questions with exactly 4 options, "answer" is the 0-based index of the correct option, wrong options must be plausible. 2-3 exam questions using BTEC command words (Describe, Explain, Analyse, Assess, Evaluate, Justify, Calculate) with 2-9 marks and one point per mark. Use only information from the slides; you may add a brief example only where a slide is unclear.

SLIDES:
<<<
${slideText()||"(see attached images)"}
>>>`;
}
const ERR={not_granted:"Claude wasn't allowed for this page. Reload and choose Allow to use the importer.",rate_limited:"You've hit a usage limit. Try again in a little while.",prompt_too_large:"That's too much at once. Import the deck in two halves.",invalid_json:"Claude's answer came back in the wrong format. Press the button to try again.",image_rejected:"One of the images couldn't be read. Remove it or use a PNG/JPEG.",refused:"Claude couldn't process these slides. Try pasting the text instead.",session_expired:"You've been signed out. Sign in to claude.ai again.",sampling_disabled:"Claude isn't available for this account.",empty_completion:"Nothing came back. Try again with a bit less content."};
function clean(d){
  d=d&&typeof d==="object"?d:{};
  const s=x=>typeof x==="string"?x.trim():"";const arr=x=>Array.isArray(x)?x:[];
  const notes=arr(d.notes).map(n=>({h:s(n&&n.h)||"Notes",b:arr(n&&n.b).map(s).filter(Boolean)})).filter(n=>n.b.length);
  const cards=arr(d.cards).map(c=>Array.isArray(c)?[s(c[0]),s(c[1])]:[s(c&&c.front),s(c&&c.back)]).filter(c=>c[0]&&c[1]);
  const quiz=arr(d.quiz).map(q=>{const o=arr(q&&q.options).map(s).filter(Boolean),a=Number(q&&q.answer);return o.length>=2&&Number.isInteger(a)&&a>=0&&a<o.length&&s(q.q)?[s(q.q),o,a,s(q.why)]:null}).filter(Boolean);
  const exam=arr(d.exam).map(e=>({q:s(e&&e.q),m:Math.max(1,Math.min(20,Math.round(Number(e&&e.marks))||4)),cmd:s(e&&e.cmd)||"Explain",pts:arr(e&&e.points).map(s).filter(Boolean)})).filter(e=>e.q&&e.pts.length);
  return {title:(s(d.title)||"Imported slides").slice(0,60),summary:s(d.summary),notes,cards,quiz,exam};
}
async function generate(){
  if(!SAMPLE||imp.status==="working")return;
  imp.status="working";imp.msg="";imp.chars=0;imp.ctl=new AbortController();drawGen();
  const opts={signal:imp.ctl.signal,cache:false,onText:({text})=>{imp.chars=text.length;const sp=document.querySelector(".spinner span");if(sp)sp.textContent=`Writing your revision pack… ${imp.chars.toLocaleString()} characters`}};
  if(imp.images.length)opts.images=imp.images.map(m=>m.file);
  try{
    const r=clean(await SAMPLE.json(buildPrompt(),opts));
    if(!r.cards.length&&!r.notes.length)throw {code:"empty_completion"};
    if(imp.target.startsWith("new:")&&imp.newName.trim())r.title=imp.newName.trim().slice(0,60);
    imp.result=r;imp.status="done";
  }catch(e){imp.status="idle";imp.msg=e&&e.code==="cancelled"?"":(ERR[e&&e.code]||"Something went wrong reaching Claude. Try again.")}
  imp.ctl=null; if(view.name==="import")drawGen();
}
async function savePackFromImport(){
  const r=imp.result,t=imp.target,isNew=t.startsWith("new:");
  const p=Object.assign({id:"pack-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now(),
    unitId:isNew?null:t,courseId:isNew?t.slice(4):getUnit(t).course.id},r);
  PACKS.push(p);persistPacks();
  const col=packsCol();
  if(col){try{await col.doc(p.id).set(JSON.parse(JSON.stringify(p)))}catch(e){toast(e&&e.code==="quota_exceeded"?"Storage full — saved on this device only":"Saved on this device; sync failed")}}
  addXP(10);save();setTimeout(()=>toast("Saved · use Sync to send it to the offline app"),1200);
  imp.text="";imp.images=[];imp.pptx=[];imp.result=null;imp.status="idle";imp.newName="";
  go({name:"unit",id:p.unitId||p.id,tab:"notes"});
}
async function deletePack(id){
  // also remove packs attached to a custom topic being deleted
  const gone=PACKS.filter(p=>p.id===id||p.unitId===id).map(p=>p.id);
  PACKS=PACKS.filter(p=>!gone.includes(p.id));persistPacks();
  gone.forEach(g=>P.gone[g]=Date.now());save();
  const col=packsCol();
  if(col)for(const g of gone){try{await col.doc(g).delete()}catch(e){}}
}


/* ============ LIVE CLOUD SYNC (installed app, Firebase) ============ */
const FB_CFG=(!IN_CLAUDE&&window.DOGTAG_FIREBASE&&window.DOGTAG_FIREBASE.apiKey)?window.DOGTAG_FIREBASE:null;
const FB_OPTS=FB_CFG?Object.fromEntries(["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"].filter(k=>FB_CFG[k]).map(k=>[k,FB_CFG[k]])):null;
const CLOUD={state:FB_CFG?"loading":"off",user:null,db:null,auth:null,prog:null,packs:null,unsub:[],timer:null,err:"",firstPacks:true};
function canon(o){if(Array.isArray(o))return "["+o.map(canon).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).filter(k=>k!=="updated"&&o[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}";return JSON.stringify(o)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function cloudStatus(){
  if(IN_CLAUDE)return;
  const st=CLOUD.state,on=navigator.onLine;
  if(!FB_CFG){setSync("","Saved on this device. Live sync isn't set up yet");return}
  if(st==="signedout"){setSync("","Saved on this device. Sign in under Sync to turn on live sync");return}
  if(!on||st==="waiting"||st==="unavailable"){setSync("busy","Offline. Changes will sync when you're back online");return}
  if(st==="error"){setSync("","Live sync problem ("+CLOUD.err+"). Saved on this device");return}
  if(st==="on")setSync("on","Live sync on");else setSync("busy","Syncing…");
}
async function initCloud(){
  if(!FB_CFG||CLOUD.auth)return;
  try{
    const B="https://www.gstatic.com/firebasejs/10.12.2/";
    if(!window.firebase){await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-auth-compat.js");await loadScript(B+"firebase-firestore-compat.js")}
    if(!firebase.apps.length)firebase.initializeApp(FB_OPTS);
    CLOUD.auth=firebase.auth();CLOUD.db=firebase.firestore();
    CLOUD.auth.onAuthStateChanged(u=>{CLOUD.user=u;cloudDetach();if(u)cloudAttach();else CLOUD.state="signedout";cloudStatus();if(view.name==="sync")render()});
  }catch(e){CLOUD.state="unavailable";cloudStatus()}
}
function cloudDetach(){CLOUD.unsub.forEach(f=>{try{f()}catch(e){}});CLOUD.unsub=[];CLOUD.prog=null;CLOUD.packs=null;CLOUD.firstPacks=true}
function softRender(){updateTop();if(view.name==="home"||view.name==="sync"||(view.name==="unit"&&!view.sub&&view.tab!=="exam"))render()}
function cloudAttach(){
  const base=CLOUD.db.collection("users").doc(CLOUD.user.uid);
  CLOUD.prog=base.collection(APP.dataNs).doc("progress");CLOUD.packs=base.collection(APP.packsNs);
  CLOUD.state="syncing";cloudStatus();
  CLOUD.unsub.push(CLOUD.prog.onSnapshot({includeMetadataChanges:true},s=>{
    if(!s.metadata.hasPendingWrites){
      let remote=null;try{remote=s.exists&&s.data().json?JSON.parse(s.data().json):null}catch(e){}
      if(remote){const before=canon(P);P=merge(P,remote);if(canon(P)!==before){persistLocal();const n=PACKS.length;PACKS=PACKS.filter(p=>!P.gone[p.id]);if(PACKS.length!==n)persistPacks();softRender()}}
      if(!remote||canon(P)!==canon(remote))cloudQueue(400);
    }
    CLOUD.state=s.metadata.fromCache?"waiting":"on";cloudStatus();
  },e=>{CLOUD.state="error";CLOUD.err=e.code||"error";cloudStatus()}));
  CLOUD.unsub.push(CLOUD.packs.onSnapshot(qs=>{
    let changed=false;const have=new Set(PACKS.map(p=>p.id));
    qs.docChanges().forEach(ch=>{const id=ch.doc.id;
      if(ch.type==="removed"){if(!ch.doc.metadata.hasPendingWrites&&!qs.metadata.fromCache&&!P.gone[id]){P.gone[id]=Date.now();PACKS=PACKS.filter(p=>p.id!==id);changed=true;save()}}
      else if(P.gone[id]){ch.doc.ref.delete().catch(()=>{})}
      else if(!have.has(id)){try{PACKS.push(cleanStored(JSON.parse(ch.doc.data().json)));have.add(id);changed=true}catch(e){}}});
    if(CLOUD.firstPacks&&!qs.metadata.fromCache){CLOUD.firstPacks=false;
      const remote=new Set(qs.docs.map(d=>d.id));
      PACKS.filter(p=>!remote.has(p.id)&&!P.gone[p.id]).forEach(p=>CLOUD.packs.doc(p.id).set({json:JSON.stringify(p)}).catch(()=>{}))}
    if(changed){persistPacks();softRender()}
  },()=>{}));
}
function cloudQueue(delay=1200){
  if(!CLOUD.prog)return;clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(()=>{if(!CLOUD.prog)return;CLOUD.prog.set({json:JSON.stringify(P),updated:P.updated||Date.now()}).catch(e=>{CLOUD.state="error";CLOUD.err=e.code||"error";cloudStatus()})},delay);
}
const AUTH_ERR={"auth/invalid-email":"That email address doesn't look right.","auth/missing-password":"Enter a password.","auth/weak-password":"Use a password of at least 6 characters.",
  "auth/email-already-in-use":"There's already an account with that email. Use Sign in instead.","auth/invalid-credential":"Wrong email or password.","auth/wrong-password":"Wrong email or password.",

function wireCloudSection(){

    try{if(!CLOUD.auth)await initCloud();if(!CLOUD.auth)throw {code:"auth/network-request-failed"};

/* ============ SYNC CODES ============ */
const SYNC_PREFIX="DOGTAG1:";
function b64e(str){const by=new TextEncoder().encode(str);let bin="";for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)}
function b64d(b){const bin=atob(b),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by)}
function makeCode(){return SYNC_PREFIX+b64e(JSON.stringify({v:1,at:Date.now(),progress:P,packs:PACKS.filter(p=>!P.gone[p.id])}))}
function readCode(s){
  s=String(s||"").replace(/\s+/g,"");
  const i=s.indexOf(SYNC_PREFIX); if(i<0) throw new Error("prefix");
  const d=JSON.parse(b64d(s.slice(i+SYNC_PREFIX.length)));
  if(!d||d.v!==1||typeof d.progress!=="object") throw new Error("shape");
  return d;
}
function cleanStored(p){
  const s=x=>typeof x==="string"?x:"",arr=x=>Array.isArray(x)?x:[];
  return {id:p.id,created:+p.created||Date.now(),unitId:typeof p.unitId==="string"?p.unitId:null,courseId:courseFor(p.courseId).id,
    title:s(p.title).slice(0,60)||"Imported slides",summary:s(p.summary),
    notes:arr(p.notes).map(n=>({h:s(n&&n.h)||"Notes",b:arr(n&&n.b).map(s).filter(Boolean)})).filter(n=>n.b.length),
    cards:arr(p.cards).filter(c=>Array.isArray(c)&&s(c[0])&&s(c[1])).map(c=>[c[0],c[1]]),
    quiz:arr(p.quiz).filter(q=>Array.isArray(q)&&s(q[0])&&Array.isArray(q[1])&&q[1].length>=2&&Number.isInteger(q[2])&&q[2]>=0&&q[2]<q[1].length).map(q=>[q[0],q[1].map(String),q[2],s(q[3])]),
    exam:arr(p.exam).filter(e=>e&&s(e.q)&&Array.isArray(e.pts)).map(e=>({q:e.q,m:Math.max(1,Math.min(20,Math.round(+e.m)||4)),cmd:s(e.cmd)||"Explain",pts:e.pts.map(String)}))};
}
async function applyCode(d){
  P=merge(P,d.progress||{});
  const have=new Set(PACKS.map(p=>p.id)),added=[];
  (Array.isArray(d.packs)?d.packs:[]).forEach(p=>{
    if(p&&typeof p.id==="string"&&/^pack-[a-z0-9]+$/.test(p.id)&&!have.has(p.id)&&!P.gone[p.id]){const c=cleanStored(p);PACKS.push(c);have.add(c.id);added.push(c)}});
  PACKS=PACKS.filter(p=>!P.gone[p.id]);
  PACKS.forEach(p=>{if(p.unitId&&!BASE[p.unitId]&&!PACKS.some(x=>x.id===p.unitId&&!x.unitId))p.unitId=null});
  persistPacks(); save();
  const col=packsCol();
  if(col){for(const p of added){try{await col.doc(p.id).set(JSON.parse(JSON.stringify(p)))}catch(e){}}}
  return added.length;
}
function renderSync(){

  ${cloudSection()}
  <div class="step"><h2><span class="num">1</span>Send from this ${IN_CLAUDE?"page":"device"}</h2>
    <p class="status">One code holding your progress${n?` and ${n} imported slide pack${n>1?"s":""}`:""}. Paste it on the other device.</p>
    <div class="row"><button class="btn" id="copyCode" style="--c:var(--it)">Copy sync code</button><span class="status" id="copyMsg"></span></div>
    <textarea id="codeOut" rows="4" readonly hidden></textarea></div>
  <div class="step"><h2><span class="num">2</span>Receive on this ${IN_CLAUDE?"page":"device"}</h2>
    <textarea id="codeIn" rows="4" placeholder="Paste a code that starts with DOGTAG1:"></textarea>
    <div class="row"><button class="btn" id="mergeBtn" style="--c:var(--soton)">Merge in</button><span class="status" id="mergeMsg"></span></div>
    <p class="status">Nothing gets wiped. Each card keeps its most recent result, quiz bests are kept, and new slide packs are added.</p></div>
  ${!IN_CLAUDE&&!APP.slides?"":`<div class="step"><h2><span class="num">3</span>${IN_CLAUDE?"Getting slides into the offline app":"Adding new slides"}</h2>
    <p class="status">${IN_CLAUDE?"Import slides on this page as usual, then come here, tap <b>Copy sync code</b>, open the offline app → <b>Sync &amp; slides</b> and paste it."
      :"Slide importing needs Claude, so do it in the Claude version of DOGTAG Revision (online). Then tap <b>Sync with the offline app</b> there, copy the code, and paste it above."}</p></div>`}`;
  wireCloudSection();
  $("#copyCode").onclick=()=>{
    const code=makeCode(),out=$("#codeOut"),msg=$("#copyMsg");
    const fallback=()=>{out.hidden=false;out.value=code;out.focus();out.select();msg.textContent="Copy the selected code"};
    try{navigator.clipboard.writeText(code).then(()=>{msg.textContent="Copied ✓ ("+Math.ceil(code.length/1024)+" KB)"},fallback)}catch(e){fallback()}
  };
  $("#mergeBtn").onclick=async()=>{
    const msg=$("#mergeMsg");

    const added=await applyCode(d);
    $("#codeIn").value="";
    msg.textContent="Merged ✓"+(added?` · ${added} new slide pack${added>1?"s":""} added`:"");
    addXP(0);
  };
}
