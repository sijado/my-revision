<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090C12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revision">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.notch{position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
</style>
<title>DOGTAG Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: "arcade revision desk" — dotted desk background, chunky colour-coded course tiles with progress rings,
   unit pages open under a full-bleed course-colour banner; one bold move = course colour everywhere, neutrals stay quiet */
:root{
  --bg:#EEF1F7; --dot:#D4DAE6; --surface:#FFFFFF; --raised:#F6F8FC; --sunk:#E4E9F2;
  --ink:#0F131C; --muted:#5A6378; --line:#DCE2EC;
  --it:#2F55F5; --biz:#F06A12; --soton:#009E88; --gold:#E9A400; --hot:#F0384F;
  --good:#12A157; --bad:#E2363A; --key:#FFE27A; --keyink:#3D2C00;
  --onc:#FFFFFF; --banner-ink:#FFFFFF; --shadow:0 1px 2px rgb(16 24 40 / .06), 0 6px 18px rgb(16 24 40 / .07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090C12; --dot:#182033; --surface:#121824; --raised:#17202F; --sunk:#1D2638;
  --ink:#EEF2F9; --muted:#98A3BA; --line:#253049;
  --it:#7290FF; --biz:#FF9A52; --soton:#2BD3B8; --gold:#FFC93C; --hot:#FF5D73;
  --good:#3FD685; --bad:#FF6B6E; --key:#4F3E0C; --keyink:#FFE49C;
  --onc:#090C12; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#090C12; --dot:#182033; --surface:#121824; --raised:#17202F; --sunk:#1D2638;
  --ink:#EEF2F9; --muted:#98A3BA; --line:#253049;
  --it:#7290FF; --biz:#FF9A52; --soton:#2BD3B8; --gold:#FFC93C; --hot:#FF5D73;
  --good:#3FD685; --bad:#FF6B6E; --key:#4F3E0C; --keyink:#FFE49C;
  --onc:#090C12; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px;background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c,var(--it));outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.02em}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:58px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.8rem;transform:rotate(-6deg);flex:none}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:700;font-size:.78rem;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.streak{color:var(--hot)} .pill.xp{color:var(--gold)}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.on{background:var(--good)} .sync.busy{background:var(--gold)}
@media (max-width:420px){.logo b{display:none}}

/* home hero */
.hero{padding-block:30px 6px;display:grid;gap:18px}
.hero h1{font-size:clamp(2.3rem,8vw,3.6rem);font-weight:800}
.hero h1 .tag{background:var(--ink);color:var(--bg);padding:0 .18em;border-radius:.18em;display:inline-block;transform:rotate(-2deg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;box-shadow:var(--shadow);min-width:0}
.stat b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.stat.s-due b{color:var(--it)} .stat.s-streak b{color:var(--hot)} .stat.s-lvl b{color:var(--gold)}
.xpbar{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:3px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat.s-lvl{grid-column:1/-1}}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media (max-width:520px){.actions{grid-template-columns:1fr}}
.big-go{border:0;border-radius:var(--r);padding:18px 20px;text-align:left;background:var(--ink);color:var(--bg);display:grid;gap:2px;box-shadow:var(--shadow)}
.big-go b{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.big-go span{opacity:.7;font-size:.88rem}
.big-go[disabled]{opacity:.55;cursor:default}
.big-imp{border:2px dashed var(--muted);border-radius:var(--r);padding:16px 18px;background:transparent;text-align:left;display:grid;gap:2px}
.big-imp b{font-family:var(--f-display);font-size:1.15rem;font-weight:800}
.big-imp span{color:var(--muted);font-size:.85rem}
.big-imp:hover{border-color:var(--ink)}

/* courses & tiles */
.course{margin-top:40px}
.course-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.blob{width:18px;height:18px;border-radius:6px;background:var(--c);transform:rotate(12deg);flex:none}
.course-h h2{font-size:clamp(1.5rem,5vw,1.9rem);font-weight:800}
.course-sub{color:var(--muted);font-size:.85rem;flex-basis:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;display:grid;gap:12px;align-content:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.code{font-family:var(--f-mono);font-weight:700;font-size:.74rem;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:8px;padding:4px 8px;white-space:nowrap}
.tile h3{font-size:1.18rem;font-weight:800}
.tile-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:.8rem}
.chip{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.exam{border-color:var(--c);color:var(--c)}
.chip.new{background:var(--c);border-color:var(--c);color:var(--onc)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0)}
.ring b{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .tile{transition:transform .18s ease,box-shadow .18s ease}
  .tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 25%,transparent)}
}

/* unit banner */
.banner{margin-top:18px;border-radius:calc(var(--r) + 4px);padding:24px 22px;color:var(--banner-ink);
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 52%,#000));display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.banner::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:40px;background:rgb(255 255 255 / .09);transform:rotate(22deg)}
.banner .txt{flex:1;min-width:0;display:grid;gap:8px;position:relative;z-index:1}
.banner .eyebrow{color:rgb(255 255 255 / .8)}
.banner h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:800}
.banner .chip{border-color:rgb(255 255 255 / .55);color:var(--banner-ink)}
.banner .ring{background:conic-gradient(#fff calc(var(--p)*1%),rgb(255 255 255 / .25) 0);width:68px;height:68px;position:relative;z-index:1}
.banner .ring b{width:54px;height:54px;background:color-mix(in srgb,var(--c) 60%,#000);color:#fff;font-size:.82rem}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center}
.tabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--onc)}
.panel{margin-top:18px}

/* notes */
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.note h3{font-size:1.2rem;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.note h3 .n{font-family:var(--f-mono);font-size:.75rem;color:var(--c);font-weight:700}
.note ul{margin:0;padding-left:1.2em;display:grid;gap:7px}
.note li{max-width:70ch}
.note li::marker{color:var(--c)}
.kt{background:var(--key);color:var(--keyink);border-radius:5px;padding:0 4px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);border-radius:5px;padding:1px 5px}
.formula{list-style:none;margin-left:-1.2em;font-family:var(--f-mono);font-size:.9rem;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:4px solid var(--c);padding:7px 12px;border-radius:0 8px 8px 0;overflow-x:auto}
.codeblock{list-style:none;margin-left:-1.2em;overflow-x:auto}
.codeblock pre{margin:0;font-family:var(--f-mono);font-size:.84rem;background:var(--sunk);border-radius:10px;padding:10px 12px;line-height:1.5}
.legend{font-size:.88rem;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.packhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:26px 0 10px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px dashed var(--c)}
.packhead b{font-family:var(--f-display);font-size:1.05rem}
.packhead p{margin:2px 0 0;color:var(--muted);font-size:.86rem;flex-basis:100%}
.tldr{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px 18px;margin-bottom:12px;font-size:1rem}
.tldr b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;margin-right:8px;color:var(--gold)}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--c,var(--it));color:var(--onc)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.danger{background:var(--bad);color:var(--onc)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

/* flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;flex:1}
.track i{display:block;height:100%;background:var(--c);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .3s ease}}
.flip{perspective:1400px;display:block;width:100%;border:0;background:none;padding:0;text-align:center}
.flip-inner{display:grid;transform-style:preserve-3d;position:relative}
@media (prefers-reduced-motion:no-preference){.flip-inner{transition:transform .55s cubic-bezier(.2,.8,.2,1)}}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:270px;border-radius:24px;padding:30px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;box-shadow:var(--shadow)}
.face.front{background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:var(--banner-ink)}
.face.front .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.15}
.face.back{transform:rotateY(180deg);background:var(--surface);border:3px solid var(--c);font-size:1.12rem}
.face .side{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.face .from{font-family:var(--f-mono);font-size:.7rem;opacity:.8}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-actions button{border-radius:16px;padding:16px;font-weight:800;font-family:var(--f-display);font-size:1.1rem;border:0}
.again{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.gotit{background:var(--good);color:var(--onc)}
.hint{color:var(--muted);font-size:.86rem;text-align:center;margin:10px 0 0}
.done{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 22px;text-align:center;display:grid;gap:12px;justify-items:center;box-shadow:var(--shadow)}
.done .big{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,12vw,4.5rem);color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.q .stem{font-family:var(--f-display);font-size:clamp(1.2rem,4.5vw,1.45rem);font-weight:700;margin:12px 0 16px;line-height:1.25}
.combo{font-family:var(--f-mono);font-weight:700;font-size:.78rem;color:var(--hot)}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--raised);border:2px solid var(--line);border-radius:14px;padding:13px 14px}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:700;background:var(--sunk);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.opt.right .k{background:var(--good);color:var(--onc)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.wrong .k{background:var(--bad);color:var(--onc)}
.opt[disabled]{cursor:default}
@media (prefers-reduced-motion:no-preference){.opt.right{animation:pop .35s ease}.opt.wrong{animation:shake .35s ease}}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:.95rem}
.explain b{color:var(--good)} .explain b.x{color:var(--bad)}
.qnav{display:flex;justify-content:flex-end;margin-top:14px}
.quizhub{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.quizhub .done{align-content:start}
.done.mistakes{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.wronglist{margin:10px 0 0;padding-left:1.3em;display:grid;gap:10px}
.wronglist li{max-width:70ch}

/* exam */
.cmdwords{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.9rem}
.cmdwords summary{font-weight:700;cursor:pointer}
.cmdwords dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0 0}
.cmdwords dt{font-family:var(--f-mono);font-weight:700;color:var(--c)}
.cmdwords dd{margin:0}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.eq .qline{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.eq .qtext{font-weight:700;min-width:0}
.marks{font-family:var(--f-mono);font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--onc);background:var(--c);border-radius:8px;padding:3px 8px}
textarea,input[type=text],select{width:100%;background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.eq textarea{min-height:110px;resize:vertical}
.scheme{background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:12px;padding:12px 14px}
.scheme ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
.selfmark{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.selfmark button{min-width:36px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-family:var(--f-mono);font-weight:700}
.selfmark button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--onc)}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* import */
.imp-h{padding-block:28px 6px;display:grid;gap:8px}
.imp-h h1{font-size:clamp(2rem,7vw,3rem);font-weight:800}
.imp-h p{margin:0;color:var(--muted);max-width:60ch}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.step h2{font-size:1.15rem;display:flex;gap:10px;align-items:center}
.step h2 .num{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;flex:none}
.drop{border:2.5px dashed var(--line);border-radius:16px;padding:6px;background:var(--raised)}
.drop.over{border-color:var(--it);background:color-mix(in srgb,var(--it) 8%,var(--raised))}
.drop textarea{border:0;background:transparent;min-height:190px;resize:vertical}
.attach{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:5px 6px 5px 10px;font-size:.85rem;max-width:100%}
.att img{width:44px;height:30px;object-fit:cover;border-radius:5px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

{id:"it1",code:"IT U1",title:"Information Technology Systems",assess:"Written exam · external",exam:true,
notes:[
{h:"Digital devices & storage",b:[
"Device types: multifunctional devices, personal computers, mobile devices, **servers**, entertainment systems, digital cameras, navigation systems, data-capture devices (e.g. barcode / RFID readers).",
"**Magnetic** storage (HDD): cheap per GB, large capacity, but moving parts so slower and less robust.",
"**Solid state** (SSD, flash): no moving parts, faster access, lower power, more durable; higher cost per GB.",
"**Optical** (CD/DVD/Blu-ray): cheap and portable, but slow and low capacity — mostly legacy/backup use.",
"Choosing hardware: think about the user's needs, cost, portability, performance, compatibility and accessibility."]},
{h:"Software & operating systems",b:[
"The **operating system** manages memory, processes (multitasking), files, security/user accounts and peripherals via **device drivers**.",
"User interfaces: **GUI** (windows, icons, menus, pointer), **command line** (fast for experts, hard to learn), menu-based, voice/natural language.",
"**Utility software** maintains the system: antivirus, backup, compression, disk clean-up/defragmentation (HDD only), firewall.",
"Application software: **off-the-shelf** (cheap, tested, support) vs **bespoke** (fits exact needs, expensive, slow to build); **open source** vs **proprietary**."]},
{h:"Transmitting data & networks",b:[
"Network types: **LAN** (one site), **WAN** (wide area, e.g. the internet), **PAN** (Bluetooth around a person), **VPN** (encrypted tunnel over a public network).",
"Wired: copper Ethernet, **fibre optic** (fast, long distance, immune to interference). Wireless: Wi-Fi, Bluetooth, 4G/5G, satellite — convenient but more interference and security risk.",
"**Bandwidth** = how much data can be sent per second. **Latency** = the delay before data starts arriving. Video calls need low latency.",
"**Protocols** are agreed rules: TCP/IP, HTTP/**HTTPS** (encrypted web), FTP (files), SMTP (sending email), IMAP/POP3 (receiving email).",
"**Packet switching**: data split into packets with headers, sent by different routes, reassembled at the destination.",
"Compression: **lossy** removes data permanently (JPEG, MP3); **lossless** rebuilds the original exactly (ZIP, PNG)."]},
{h:"Operating online & threats",b:[
"Cloud models: **SaaS** (software via browser, e.g. Google Docs), **PaaS** (platform for developers), **IaaS** (rented servers/storage).",
"Cloud pros: access anywhere, collaboration, scalable, no hardware to maintain. Cons: needs internet, ongoing cost, data held by a third party.",
"Threats: **malware** (virus, worm, trojan, spyware, **ransomware**), **phishing**, hacking, **DDoS**, social engineering, shoulder surfing, accidental damage.",
"Protection: firewall, antivirus, **encryption**, strong passwords, **two-factor authentication**, access rights, regular backups, staff training, physical security (locks, CCTV)."]},
{h:"Laws & ethics",b:[
"**Data Protection Act 2018 / UK GDPR** — 7 principles: lawfulness, fairness & transparency; purpose limitation; **data minimisation**; accuracy; **storage limitation**; integrity & confidentiality (security); accountability.",
"**Computer Misuse Act 1990**: unauthorised access; unauthorised access with intent to commit further offences; unauthorised acts that impair a computer (e.g. modifying data, spreading malware).",
"**Copyright, Designs and Patents Act 1988** protects creative work and software from being copied without permission.",
"**Equality Act 2010**: services and workplaces must make reasonable adjustments — accessible IT (screen readers, captions, keyboard access).",
"Ethical issues: privacy & monitoring, the **digital divide**, environmental impact (e-waste, energy use), online abuse, net neutrality."]},
{h:"Flowcharts & data flow diagrams",b:[
"Flowchart symbols: terminator (rounded box) start/end; rectangle = process; **diamond = decision**; parallelogram = input/output.",
"**Data flow diagram (DFD)**: external entity (square), process (rounded box), data store (open box), data flow (labelled arrow).",
"Exam tip: label every arrow on a DFD and make sure every decision on a flowchart has two labelled exits (Yes / No)."]}
],
cards:[
["Bandwidth vs latency","Bandwidth = amount of data sent per second. Latency = delay before data arrives."],
["Lossy vs lossless compression","Lossy permanently removes data (smaller, e.g. JPEG/MP3). Lossless restores the original exactly (e.g. ZIP/PNG)."],
["Phishing","Fake emails/messages pretending to be a trusted organisation to trick people into giving details or clicking malicious links."],
["DDoS attack","Distributed Denial of Service — many devices (a botnet) flood a server with requests so real users can't access it."],
["Ransomware","Malware that encrypts a victim's files and demands payment for the key."],
["Symmetric vs asymmetric encryption","Symmetric: same key encrypts and decrypts. Asymmetric: public key encrypts, private key decrypts."],
["Two-factor authentication","Logging in needs two different types of proof, e.g. password + code sent to your phone."],
["Data minimisation (UK GDPR)","Only collect personal data that is adequate, relevant and limited to what is needed for the purpose."],
["Computer Misuse Act 1990","Makes unauthorised access, access with intent to commit further crimes, and unauthorised acts that impair a computer illegal."],
["Device driver","Software that lets the operating system communicate with a specific piece of hardware."],
["Packet switching","Data is split into numbered packets that may take different routes and are reassembled at the destination."],
["SaaS / PaaS / IaaS","Software (apps in a browser) / Platform (tools to build apps) / Infrastructure (rented servers, storage) as a Service."],
["Digital divide","The gap between people who have good access to technology and the internet and those who don't."],
["Flowchart: diamond","A decision — must have two exits (e.g. Yes / No)."]],

{q:"A college stores students' personal records on its network. Discuss the measures the college should take to protect this data.",m:8,cmd:"Discuss",pts:["Access rights/levels so staff only see data they need — links to UK GDPR integrity & confidentiality.","Strong passwords + two-factor authentication to stop unauthorised access.","Encryption of stored data and data in transit so stolen data is unreadable.","Firewall and up-to-date antivirus to block hacking and malware.","Regular, off-site/cloud backups so data can be restored after ransomware or hardware failure.","Staff training on phishing/social engineering — people are often the weakest link.","Physical security: locked server rooms, CCTV, logging off unattended PCs.","Balanced points: cost/time of measures vs consequences (fines from ICO, reputational damage). Higher marks need a reasoned conclusion."]},
{q:"Assess the impact on employees of a company introducing remote working supported by IT systems.",m:9,cmd:"Assess",pts:["Positive: no commuting — saves time and money, better work–life balance.","Positive: flexible hours; can live further from the office; suits people with caring responsibilities or disabilities.","Negative: isolation, less informal support from colleagues; harder to switch off.","Negative: needs reliable broadband and suitable equipment/space at home.","Security responsibilities: VPN, secure Wi-Fi, keeping devices locked.","Communication via video calls, instant messaging, shared cloud documents — needs IT skills/training.","Conclusion weighing up which impacts are most significant and for which employees."]}]

{id:"it2",code:"IT U2",title:"Creating Systems to Manage Information",assess:"Set task · external",exam:true,
notes:[
{h:"Relational databases",b:[
"A **table** stores one entity (e.g. Customer). Each row is a **record**, each column is a **field** (attribute).",
"**Primary key**: field that uniquely identifies each record (e.g. CustomerID). **Composite key**: two or more fields together form the key.",
"**Foreign key**: a field in one table that is the primary key of another table — it creates the relationship.",
"Relationships: one-to-one, **one-to-many** (most common), many-to-many — must be split using a **link (junction) table**."]},
{h:"ERDs & data dictionary",b:[
"An **ERD** shows entities and relationships; crow's foot marks the 'many' side.",
"A **data dictionary** lists for each field: name, data type, size, format, validation rule, description, key.",
"Data types: Short Text, Number (integer/decimal), Currency, Date/Time, Yes/No (Boolean), AutoNumber.",
"Use text, not number, for phone numbers (leading 0) and postcodes."]},
{h:"Normalisation",b:[
"Purpose: remove **data redundancy** and prevent **anomalies** (insert, update, delete problems).",
"**1NF**: atomic (single) values, no repeating groups, each table has a primary key.",
"**2NF**: in 1NF + no **partial dependencies** (non-key fields depend on the whole composite key).",
"**3NF**: in 2NF + no **transitive dependencies** (non-key fields depend only on the key, 'the key, the whole key and nothing but the key')."]},
{h:"Data integrity: validation & verification",b:[
"**Validation** checks data is sensible/allowed: range, presence, type, length, format (input mask), lookup/list check.",
"**Verification** checks data was entered correctly: double entry (e.g. type password twice), visual check against the source.",
"**Referential integrity**: a foreign key value must match an existing primary key — stops 'orphan' records. Cascade update/delete keeps tables consistent."]},
{h:"Queries, forms & reports",b:[
"Query types: select, **parameter** (asks the user for a value), multi-table, calculated field, update/delete/append.",
"Criteria: `AND`, `OR`, `Between 10 And 20`, `Like \"S*\"` (wildcard), `>`, `<>`.",
"$ SELECT FirstName, Surname\nFROM Customer\nWHERE Town = \"Wakefield\"\nORDER BY Surname;",
"**Forms**: user-friendly data entry (combo boxes, buttons, clear labels). **Reports**: formatted output, grouping and totals. A **navigation/menu form** ties the system together."]},
{h:"Testing & evaluation",b:[
"Test plan columns: test no., purpose, test data, expected result, actual result, action taken.",
"Test data: **normal** (valid), **extreme/boundary** (on the edges of the valid range), **erroneous** (invalid, should be rejected).",
"Evaluate against the client's requirements: does it meet each one? Usability, efficiency, robustness and improvements you'd make with more time."]}
],
cards:[
["Primary key","A field that uniquely identifies each record in a table."],
["Foreign key","A field in one table that is the primary key of another, linking the two tables."],
["Composite key","A primary key made of two or more fields combined."],
["1NF","Atomic values, no repeating groups, every table has a primary key."],
["2NF","1NF + no partial dependencies on part of a composite key."],
["3NF","2NF + no transitive dependencies (non-key fields depend only on the key)."],
["Referential integrity","Every foreign key value must match an existing primary key value, so no orphan records."],
["Validation vs verification","Validation: is the data sensible/allowed? Verification: was it entered/copied correctly?"],
["Range check","Validation that data falls between a minimum and maximum, e.g. age 16–19."],
["Boundary (extreme) test data","Values on the edges of the valid range, e.g. 16 and 19 for a 16–19 range."],
["Update anomaly","When the same data is stored in several places, changing one copy leaves the others out of date."],
["Junction (link) table","A table used to break a many-to-many relationship into two one-to-many relationships."],
["Data dictionary","Documentation of each field: name, data type, size, format, validation, description, key."],
["Parameter query","A query that asks the user to type a value to search on when it runs."]],
quiz:[

["A field in one table that links to the primary key in another is a…",["Composite key","Candidate key","Foreign key","Index"],2,"Foreign keys create relationships between tables."],
["Checking an age is between 16 and 19 is a…",["Presence check","Range check","Format check","Length check"],1,"A range check tests values against a minimum and maximum."],
["For a valid range of 16–19, the value 19 is…",["Normal data","Boundary/extreme data","Erroneous data","Invalid data"],1,"19 is valid but on the edge of the range."],
["A non-key field depending on another non-key field breaks…",["1NF","2NF","3NF","Referential integrity"],2,"That is a transitive dependency, which 3NF removes."],
["A many-to-many relationship should be resolved by…",["Deleting one table","Adding a junction (link) table","Using a composite field","Turning off referential integrity"],1,"The link table holds both foreign keys."],
["Which SQL keyword filters records?",["SELECT","FROM","WHERE","ORDER BY"],2,"WHERE sets the criteria."],
["Typing a new password twice is an example of…",["Validation","Verification","Normalisation","Encryption"],1,"Double entry is a verification method."],
["The criteria Like \"S*\" returns values that…",["End in S","Contain S anywhere","Start with S","Are exactly S*"],2,"* is a wildcard for any characters after S."]],

{q:"Explain why referential integrity should be enforced between the Customer and Booking tables.",m:3,cmd:"Explain",pts:["It stops a booking being entered for a CustomerID that doesn't exist (1)","so there are no orphan records / data stays consistent (1)","and with cascade delete/update, changes to a customer are applied to their bookings (1)."]},

{q:"Explain how you would use normal, extreme and erroneous test data to test a field that accepts a quantity from 1 to 50.",m:6,cmd:"Explain",pts:["Normal: e.g. 25 (1) — should be accepted, proves the field works for typical input (1).","Extreme/boundary: 1 and 50 (1) — should be accepted; checks the rule uses >= / <= correctly (1).","Erroneous: e.g. 0, 51, 'ten' (1) — should be rejected with a clear error message (1)."]}]

{id:"it3",code:"IT U3",title:"Using Social Media in Business",assess:"Assignment · internal",exam:false,
notes:[
{h:"Platforms & business uses",b:[
"Platforms suit different audiences: Instagram & TikTok (visual, younger), LinkedIn (professional/B2B, recruitment), Facebook (broad, groups, events), YouTube (video/tutorials), X (news, quick updates), Pinterest (inspiration).",
"Business uses: **brand awareness**, promoting products, **customer service**, building **engagement** and loyalty, market research, recruitment, sharing news with stakeholders."]},
{h:"Benefits & risks",b:[
"Benefits: low cost, huge **reach**, **targeted ads** (age, location, interests), two-way communication, instant feedback, potential to go **viral**, built-in analytics.",
"Risks: negative comments and **reputational damage**, time/staff cost, account hacking, legal problems, inconsistent brand voice, hard to measure return on investment."]},
{h:"Planning social media use",b:[
"Start from the business requirements and **SMART objectives** (e.g. increase Instagram followers by 15% in 3 months).",
"Define the **target audience** (demographics, interests) and pick platforms they actually use.",
"Content types: images, short video, stories, polls, live streams, **user-generated content** (UGC), competitions.",
"A **content calendar** plans what to post, where and when. **Scheduling tools** (e.g. Meta Business Suite, Hootsuite, Buffer) post automatically.",
"A **social media policy** sets rules for staff: who can post, tone, how to deal with complaints, what is never shared."]},
{h:"Legal & ethical issues",b:[
"**UK GDPR**: get consent for collecting data (competition entries, mailing lists).",
"**Copyright**: don't use images or music you don't have rights to.",
"**ASA / CAP Code**: adverts must be obviously identifiable (e.g. **#ad** on paid influencer posts) and not misleading.",
"Accessibility: **alt text** on images, captions on videos, readable colour contrast."]},
{h:"Measuring success",b:[
"**Reach** = number of unique people who saw content. **Impressions** = total number of times it was shown.",
"**Engagement** = likes, comments, shares, saves, clicks.",
"= Engagement rate = engagements ÷ reach (or followers) × 100",
"= Click-through rate (CTR) = clicks ÷ impressions × 100",
"Also track follower growth, conversions (sales/sign-ups) and **sentiment**; use insights to adjust the plan."]}
],
cards:[
["Reach vs impressions","Reach = unique people who saw it. Impressions = total times it was displayed (one person can count several times)."],
["Engagement rate","Engagements ÷ reach (or followers) × 100."],
["Click-through rate (CTR)","Clicks ÷ impressions × 100."],
["User-generated content (UGC)","Content made by customers, e.g. reviews or photos tagged with the brand."],
["Content calendar","A schedule of what will be posted, on which platform, and when."],
["ASA / CAP Code","UK advertising rules — ads must be identifiable (e.g. #ad) and not misleading."],
["Social media policy","Company rules for how staff use and represent the business on social media."],
["Targeted advertising","Paid ads shown only to chosen groups, e.g. by age, location or interests."],
["Sentiment","Whether comments/mentions are positive, negative or neutral about the brand."],
["Influencer marketing","Paying or gifting people with large followings to promote a product."],
["SMART objective","Specific, Measurable, Achievable, Realistic/Relevant, Time-bound."]],
quiz:[
["Total number of times a post was displayed is…",["Reach","Impressions","Engagement","Followers"],1,"Impressions count every display, including repeats."],
["A post reached 2,000 people and got 100 engagements. Engagement rate?",["2%","5%","20%","50%"],1,"100 ÷ 2,000 × 100 = 5%."],
["Which platform is best for B2B networking and recruitment?",["TikTok","Pinterest","LinkedIn","Snapchat"],2,"LinkedIn is the professional network."],
["Under the CAP Code a paid influencer post should be…",["Hidden as a normal post","Clearly labelled, e.g. #ad","Only shown to under-18s","Posted at night"],1,"Ads must be obviously identifiable."],
["Customers posting photos of a café's cakes and tagging it is…",["UGC","PPC","SEO","A DDoS"],0,"User-generated content."],
["A document that plans posts by date and platform is a…",["Social media policy","Content calendar","Data dictionary","Marketing budget"],1,"A content calendar schedules what goes out when."],
["Which is a RISK of social media for a business?",["Low cost","Two-way communication","Negative public comments","Analytics"],2,"Negative comments can damage reputation."]],
exam:[
{q:"Explain how a small independent café could use social media to increase customer engagement.",m:4,cmd:"Explain",pts:["Post daily specials/behind-the-scenes on Instagram (1) to give followers a reason to interact and visit (1).","Run a competition, e.g. share & tag a friend (1) which increases reach and comments (1).","Reply quickly to comments/reviews (1) builds loyalty and shows good customer service (1)."]},
{q:"Justify the choice of two social media platforms for a business targeting 18–24 year olds.",m:6,cmd:"Justify",pts:["TikTok: very high use among 18–24s; short, entertaining video suits product demos; algorithm can push content to non-followers (viral reach).","Instagram: strong 18–24 use; visual brand building; Stories/Reels; shopping features and targeted ads.","Justification must link features to the audience and the business objectives — and say why other platforms (e.g. Facebook, LinkedIn) are less suitable."]},
{q:"Assess the risks to a business of using social media, and how they could be reduced.",m:8,cmd:"Assess",pts:["Negative comments/viral complaints → reply politely and quickly; have a complaints procedure in the policy.","Staff posting inappropriately → social media policy and training; limit who has login access.","Account hacking → strong passwords, 2FA, limited admin roles.","Legal breaches (copyright, GDPR, ASA) → use own/licensed images, consent for data, label ads.","Time and cost with unclear return → SMART objectives and analytics to measure ROI.","Conclusion: which risk is most serious for this business and whether benefits outweigh risks."]}]
}]},
{id:"biz",name:"BTEC Business",color:"--biz",full:"Pearson BTEC Level 3 National Extended Certificate in Business (single)",units:[
{id:"b1",code:"BUS U1",title:"Exploring Business",assess:"Assignment · internal",exam:false,
notes:[
{h:"Purpose, sectors & ownership",b:[
"Aims: survival, **profit**, growth, market share, providing a service, social/ethical aims.",
"Sectors by activity: **primary** (raw materials), **secondary** (manufacturing), **tertiary** (services). By ownership: private, public, voluntary/not-for-profit.",
"**Sole trader**: one owner, keeps all profit, **unlimited liability**.",
"**Partnership**: 2+ owners share skills and capital; usually unlimited liability (an LLP gives limited liability).",
"**Private limited company (Ltd)**: owned by shareholders, **limited liability**, shares not sold to the public.",
"**Public limited company (plc)**: shares traded on the stock exchange — raises lots of capital but risk of takeover and more regulation.",
"Also: **social enterprise** (profit reinvested in a social aim), charity, franchise, cooperative."]},
{h:"Stakeholders",b:[
"**Internal**: owners/shareholders, managers, employees. **External**: customers, suppliers, lenders, government, local community, pressure groups.",
"Stakeholders can **conflict**: e.g. shareholders want higher profit, employees want higher pay, the community wants less pollution.",
"**Mendelow's matrix** maps stakeholders by power and interest to decide how much to involve them."]},
{h:"Structure & functional areas",b:[
"**Hierarchical (tall)**: many levels, narrow **span of control**, long **chain of command** — clear roles but slow communication.",
"**Flat**: few levels, wide span of control — quicker decisions, more responsibility for staff.",
"**Matrix**: staff in project teams drawn from different departments.",
"Centralised (decisions at the top) vs decentralised (decisions delegated).",
"Functional areas: HR, finance, marketing, sales, operations/production, customer service, R&D, IT, admin — they must work together."]},
{h:"The business environment",b:[
"**PESTLE**: Political, Economic, Social, Technological, Legal, Environmental external factors.",
"**SWOT**: internal Strengths & Weaknesses, external Opportunities & Threats.",
"**Porter's Five Forces**: rivalry, threat of new entrants, buyer power, supplier power, threat of substitutes.",
"Economic factors: interest rates (cost of borrowing), inflation, exchange rates, unemployment, consumer confidence."]},
{h:"Markets & competition",b:[
"Market structures: highly competitive, **oligopoly** (few large firms), **monopoly** (one dominant firm — UK legal definition: 25%+ market share).",
"**Demand** falls as price rises; **supply** rises as price rises; equilibrium price is where they meet.",
"Firms compete on price, quality, brand, customer service, location, innovation."]},
{h:"Innovation & enterprise",b:[
"**Product innovation** (new/improved products) vs **process innovation** (better ways of producing).",
"Benefits: competitive advantage, new markets, higher prices. Risks: cost of **R&D**, failure, copying by rivals.",
"Protect ideas with **intellectual property**: patents, trademarks, copyright, design rights.",
"Entrepreneur traits: risk-taking, creativity, resilience, self-motivation, leadership."]}
],
cards:[
["Unlimited liability","The owner is personally responsible for all business debts — personal possessions can be taken."],
["Limited liability","Owners can only lose the money they invested in the business."],
["Ltd vs plc","Ltd: shares not sold to the public. plc: shares traded publicly on a stock exchange."],
["Social enterprise","A business with social or environmental aims that reinvests most profit into those aims."],
["Stakeholder","Any person or group with an interest in, or affected by, a business."],
["Span of control","The number of staff directly managed by one manager."],
["Chain of command","The line of authority from the top of an organisation to the bottom."],
["PESTLE","Political, Economic, Social, Technological, Legal, Environmental."],
["SWOT","Strengths, Weaknesses (internal); Opportunities, Threats (external)."],
["Oligopoly","A market dominated by a few large firms, e.g. UK supermarkets."],
["Porter's Five Forces","Rivalry, new entrants, buyer power, supplier power, substitutes."],
["Process innovation","A new or improved way of producing or delivering a product."]],

{id:"b2",code:"BUS U2",title:"Developing a Marketing Campaign",assess:"Set task · external",exam:true,
notes:[
{h:"Role & aims of marketing",b:[
"Marketing identifies and satisfies customer needs profitably.",
"Aims: brand awareness, increase sales or **market share**, launch a product, enter a new market, reposition a brand.",
"Objectives should be **SMART**: Specific, Measurable, Achievable, Realistic, Time-bound.",
"**B2C** (business to consumer) vs **B2B** (business to business) marketing."]},
{h:"Market research",b:[
"**Primary** (field) research: surveys, interviews, focus groups, observation, test marketing — specific and up to date but costly and slow.",
"**Secondary** (desk) research: ONS/government statistics, Mintel reports, internal sales data, competitor websites — cheap and quick but may be out of date or not specific.",
"**Quantitative** = numbers/statistics. **Qualitative** = opinions, reasons, feelings.",
"Sampling: random, quota, stratified. Watch out for **bias**, small samples and reliability/validity."]},
{h:"Segmentation, targeting & positioning",b:[
"Segmentation: **demographic** (age, gender, income), **geographic**, **psychographic** (lifestyle, values), **behavioural** (usage, loyalty).",
"A **market map** plots brands on two features (e.g. price vs quality) to find gaps.",
"**USP** (unique selling point): what makes the product stand out from competitors."]},
{h:"The marketing mix",b:[
"**4Ps**: Product, Price, Place, Promotion. **7Ps** add People, Process, Physical evidence (important for services).",
"Pricing: **penetration** (low to enter market), **skimming** (high at launch, then lower), competitive, cost-plus, psychological (£9.99), premium.",
"**Product life cycle**: development → introduction → growth → maturity → decline; extension strategies (new versions, new markets, rebranding).",
"**Boston Matrix**: stars (high growth, high share), cash cows (low growth, high share), question marks (high growth, low share), dogs (low growth, low share).",
"**Ansoff Matrix**: market penetration (lowest risk), product development, market development, diversification (highest risk)."]},
{h:"Promotion & the campaign",b:[
"**AIDA**: Attention, Interest, Desire, Action.",
"**Above the line** (mass media: TV, radio, press, cinema) vs **below the line** (targeted: social media, email, sales promotions, PR, sponsorship, direct mail).",
"Digital: SEO, pay-per-click, social media, influencers, email marketing.",
"A campaign plan includes: aims & objectives, target market, mix, media & timings, **budget**, and how success will be measured (**KPIs**).",
"Set-task tip: **justify** every choice with evidence from the case study and research."]}
],

{id:"b3",code:"BUS U3",title:"Personal and Business Finance",assess:"Written exam · external",exam:true,
notes:[
{h:"Personal finance",b:[
"Functions of money: medium of exchange, store of value, unit of account, standard of deferred payment.",
"Accounts & products: current account, **overdraft** (arranged/unarranged), savings account, **ISA** (tax-free interest), loan, **mortgage** (repayment vs interest-only), credit card, store card, payday loan.",
"**APR** = annual cost of borrowing including fees — compare loans with it. **AER** = annual return on savings including compounding.",
"Payslip: **gross pay** − deductions (income tax, National Insurance, pension, student loan) = **net pay**.",
"Risk vs reward: higher potential return usually means higher risk (e.g. shares vs savings account)."]},
{h:"Financial organisations & protection",b:[
"Banks (owned by shareholders), **building societies** (mutual — owned by members), credit unions, insurance companies, pension providers.",
"**FCA** (Financial Conduct Authority) regulates financial firms and how they treat customers.",
"**Financial Ombudsman Service** settles complaints between consumers and financial businesses for free.",
"**FSCS** compensates savers (up to a limit per person, per bank) if a bank fails.",
"Consumer protection laws include the Consumer Credit Act 1974 and Consumer Rights Act 2015."]},
{h:"Costs, revenue & break-even",b:[
"**Fixed costs** don't change with output (rent, salaries). **Variable costs** change with output (materials).",
"= Total cost = fixed costs + (variable cost per unit × quantity)",
"= Revenue = selling price × quantity",
"= Contribution per unit = selling price − variable cost per unit",
"= Break-even point (units) = fixed costs ÷ contribution per unit",
"= Margin of safety = actual (or budgeted) sales − break-even sales",
"Limitations: assumes all output is sold, costs and prices stay constant, single product."]},
{h:"Cash flow",b:[
"Cash flow forecast rows: inflows (receipts), outflows (payments), net cash flow, opening balance, closing balance.",
"= Net cash flow = total inflows − total outflows",
"= Closing balance = opening balance + net cash flow (closing becomes next month's opening)",
"Cash ≠ profit: a profitable firm can fail if customers pay late.",
"Improve cash flow: chase trade receivables, delay payments to suppliers, overdraft, **factoring**, sale and leaseback, cut stock levels."]},
{h:"Sources of finance",b:[
"**Internal**: owner's capital, **retained profit**, selling assets.",
"**External short-term**: overdraft, trade credit, factoring. **Long-term**: bank loan, mortgage, share issue, venture capital, business angels, crowdfunding, leasing, hire purchase, grants.",
"Choose by: amount, cost (interest/fees), time period, control (share issues dilute ownership), risk."]},
{h:"Financial statements & ratios",b:[
"**Statement of comprehensive income** (income statement): revenue − cost of sales = **gross profit**; gross profit − expenses = **net profit**.",
"**Statement of financial position** (balance sheet): non-current assets + current assets − liabilities = net assets = capital/equity.",
"= Straight-line depreciation per year = (cost − residual value) ÷ useful life (years)",
"= Gross profit margin = gross profit ÷ revenue × 100",
"= Net profit margin = net profit ÷ revenue × 100",
"= Mark-up = gross profit ÷ cost of sales × 100",
"= ROCE = net/operating profit ÷ capital employed × 100",
"= Current ratio = current assets ÷ current liabilities (around 1.5–2 : 1 is often seen as healthy)",
"= Liquid capital (acid test) ratio = (current assets − inventory) ÷ current liabilities"]}
],
cards:[
["Break-even point formula","Fixed costs ÷ (selling price − variable cost per unit)."],
["Contribution per unit","Selling price − variable cost per unit."],
["Margin of safety","Actual sales − break-even sales."],
["Gross profit margin","Gross profit ÷ revenue × 100."],
["Net profit margin","Net profit ÷ revenue × 100."],
["Mark-up","Gross profit ÷ cost of sales × 100."],
["ROCE","Net (operating) profit ÷ capital employed × 100."],
["Current ratio","Current assets ÷ current liabilities."],
["Acid test (liquid capital) ratio","(Current assets − inventory) ÷ current liabilities."],
["APR","Annual Percentage Rate — yearly cost of borrowing including interest and fees."],
["AER","Annual Equivalent Rate — yearly interest on savings including compounding."],
["Factoring","Selling unpaid invoices to a factor for immediate cash (less a fee)."],
["Building society","Mutual organisation owned by its members (savers and borrowers), not shareholders."],
["Financial Ombudsman Service","Free service that settles disputes between consumers and financial firms."],
["Straight-line depreciation","(Cost − residual value) ÷ years of useful life."],
["Closing balance","Opening balance + net cash flow."]],

{q:"Assess whether a bank loan or crowdfunding is more suitable for a small business raising £40,000 to open a second shop.",m:8,cmd:"Assess",pts:["Bank loan: owner keeps full control; fixed repayments help budgeting; interest and fees add cost; may need security/collateral and a credit check.","Crowdfunding: no repayments for reward-based schemes; publicity and evidence of demand; equity crowdfunding gives away part ownership; campaign may fail to hit target; takes time and marketing effort.","Consider: the firm's credit history, current interest rates, how quickly money is needed, whether the business has a loyal customer base.","Conclusion with a justified decision — e.g. loan if cash flow can cover repayments, crowdfunding if the brand has a strong community."]}]

{id:"soton",name:"Southampton FY · Entry Maths",color:"--soton",full:"The maths Southampton expects before the Foundation Year starts: GCSE grade 6, plus their maths diagnostic test, based on the university's Pre-Maths Skills list",units:[
{id:"m1",code:"MATHS 1",title:"Number Skills",assess:"Core · diagnostic test",exam:true,
notes:[
{h:"Decimals & rounding",b:[
"Round to **decimal places** (d.p.) by looking at the next digit: 5 or more rounds up. 3.14159 → 3.142 (3 d.p.).",
"**Significant figures** count from the first non-zero digit: 0.004072 → 0.00407 (3 s.f.).",
"Positive powers are repeated multiplication: 10³ = 10 × 10 × 10 = 1000; 2⁵ = 32."]},
{h:"Negative numbers",b:[
"Multiplying or dividing: **same signs give a positive**, different signs give a negative. (−4) × (−3) = 12; (−12) ÷ 4 = −3.",
"Subtracting a negative is adding: 5 − (−3) = 8.",
"Adding a negative is subtracting: 7 + (−9) = −2."]},
{h:"Factors",b:[
"**Factors** of a number divide it exactly: the factors of 24 are 1, 2, 3, 4, 6, 8, 12, 24.",
"**Prime factorisation** writes a number as primes multiplied: 60 = 2² × 3 × 5.",
"**HCF** = highest common factor; **LCM** = lowest common multiple. For 12 and 18: HCF 6, LCM 36."]},
{h:"Fractions",b:[
"Add or subtract with a **common denominator**: 2/3 + 1/4 = 8/12 + 3/12 = 11/12.",
"Multiply tops together and bottoms together: 2/3 × 3/5 = 6/15 = 2/5.",
"Divide by flipping the second fraction and multiplying (**keep, change, flip**): 3/4 ÷ 1/2 = 3/4 × 2/1 = 3/2.",
"Mixed number to improper fraction: 2¾ = (2 × 4 + 3)/4 = 11/4.",
"**Cancel** by dividing top and bottom by the same factor: 18/24 = 3/4."]},
{h:"Order of operations & estimating",b:[
"**BIDMAS**: Brackets, Indices (powers and roots), Division and Multiplication, Addition and Subtraction.",
"= 3 + 4 × 2² = 3 + 4 × 4 = 19",
"Watch the sign: −3² = −9, but (−3)² = 9.",
"**Estimate** by rounding every number to 1 significant figure: 49.6 × 0.21 ≈ 50 × 0.2 = 10."]},
{h:"Percentages",b:[
"= x% of A = (x ÷ 100) × A",
"= Percentage change = change ÷ original × 100",
"Use a **multiplier**: increase by 15% → × 1.15; decrease by 20% → × 0.8."]},
{h:"SI units & standard form",b:[
"SI base units: mass in **kilograms (kg)**, length in **metres (m)**, time in **seconds (s)**.",
"1 m = 100 cm = 1000 mm; 1 km = 1000 m; 1 kg = 1000 g.",
"Areas convert by the square and volumes by the cube: 1 m² = 10 000 cm²; 1 m³ = 1 000 000 cm³.",
"**Scientific (standard) notation** is a × 10ⁿ with 1 ≤ a < 10: 45 000 = 4.5 × 10⁴; 0.0032 = 3.2 × 10⁻³."]}
],

{id:"m2",code:"MATHS 2",title:"Algebra Essentials",assess:"Core · diagnostic test",exam:true,
notes:[
{h:"Simplifying & substituting",b:[
"**Collect like terms**: 3x + 2y − x + 5y = 2x + 7y.",
"**Substitute** using brackets so signs stay right: if x = −2, then 3x² − x = 3(4) − (−2) = 14.",
"Letters follow the power rules too: x × x = x²; 2a × 3a = 6a²."]},
{h:"Brackets & factorising",b:[
"Single bracket: 3(2x − 5) = 6x − 15.",
"**Double brackets**: multiply every term by every term. (x + 3)(x − 5) = x² − 5x + 3x − 15 = x² − 2x − 15.",
"= (a + b)² = a² + 2ab + b²   (not a² + b²)",
"**Factorise** by taking out the HCF: 6x² + 9x = 3x(2x + 3).",
"**Difference of two squares**: x² − 25 = (x + 5)(x − 5)."]},
{h:"Linear equations",b:[
"Do the same to both sides until x is alone: 5x − 7 = 18 → 5x = 25 → x = 5.",
"Unknown on both sides: collect the x terms on one side first. 7x + 3 = 2x + 23 → 5x = 20 → x = 4.",
"With fractions, multiply through by the denominator first: (x + 4)/3 = 5 → x + 4 = 15 → x = 11.",
"**Word problems**: call the unknown x, write an equation, solve it, then answer the question in words."]},
{h:"Linear inequalities",b:[
"Solve them like equations: 3x + 2 < 14 → 3x < 12 → x < 4.",
"**Multiplying or dividing by a negative flips the sign**: −2x ≥ 6 → x ≤ −3.",
"On a number line, use an open circle for < or > and a filled circle for ≤ or ≥."]},
{h:"Rearranging formulae",b:[
"Use inverse operations, undoing things in reverse BIDMAS order.",
"= v = u + at  →  t = (v − u) / a",
"With squares and roots: A = πr² → r = √(A/π); T = 2π√(L/g) → L = gT²/(4π²).",
"If the new subject appears twice, collect those terms on one side and **factorise** it out: ax + b = cx → x(a − c) = −b → x = b/(c − a)."]},
{h:"Algebraic fractions",b:[
"**Cancel only whole factors**: (x² − 9)/(x + 3) = (x + 3)(x − 3)/(x + 3) = x − 3.",
"Add with a common denominator: 1/x + 2/y = (y + 2x)/(xy).",
"Multiply and divide like number fractions: (2/x) ÷ (4/x²) = (2/x) × (x²/4) = x/2."]}
],

const BASE={}; COURSES.forEach(c=>c.units.forEach(u=>{u.course=c;BASE[u.id]=u}));
const COURSE=Object.fromEntries(COURSES.map(c=>[c.id,c]));
const LS="dogtag-revision-v1", LSP="dogtag-packs-v1";
const DAY=864e5, GAPS=[0,1,3,7,14,30];
let P={cards:{},quiz:{},exam:{},days:{},updated:0};
try{const s=localStorage.getItem(LS); if(s) P=Object.assign(P,JSON.parse(s));}catch(e){}
P.days=P.days||{}; P.gone=P.gone||{}; P.wrong=P.wrong||{};
const IN_CLAUDE=!!(window.claude&&window.claude.use);
let PACKS=[];
try{const s=localStorage.getItem(LSP); if(s) PACKS=(JSON.parse(s)||[]).filter(p=>!P.gone[p.id]);}catch(e){}
let DB=null, UID=null, docRef=null, SAMPLE=null, LIMITS=null, writing=false, dirty=false, timer=null;
const syncEl=document.getElementById("sync");
function setSync(cls,title){syncEl.className="sync "+cls;syncEl.title=title}

function merge(a,b){
  const out={cards:{},quiz:{},exam:{},wrong:{},days:{},updated:Math.max(a.updated||0,b.updated||0)};
  for(const k of ["cards","exam","wrong"]){
    const A=a[k]||{},B=b[k]||{};
    new Set([...Object.keys(A),...Object.keys(B)]).forEach(id=>{const x=A[id],y=B[id];out[k][id]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x)});
  }
  const QA=a.quiz||{},QB=b.quiz||{};
  new Set([...Object.keys(QA),...Object.keys(QB)]).forEach(id=>{
    const x=QA[id]||{},y=QB[id]||{},later=(y.t||0)>(x.t||0)?y:x;
    out.quiz[id]={best:Math.max(x.best||0,y.best||0),last:later.last,n:Math.max(x.n||0,y.n||0),t:later.t||0}});
  const DA=a.days||{},DB_=b.days||{};
  new Set([...Object.keys(DA),...Object.keys(DB_)]).forEach(d=>out.days[d]=Math.max(DA[d]||0,DB_[d]||0));
  const GA=a.gone||{},GB=b.gone||{};out.gone=Object.assign({},GA);for(const k in GB)out.gone[k]=Math.max(GA[k]||0,GB[k]||0);
  return out;
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function persistPacks(){try{localStorage.setItem(LSP,JSON.stringify(PACKS))}catch(e){}}
function save(){
  P.updated=Date.now(); persistLocal(); updateTop();
  if(!docRef) return;
  dirty=true; setSync("busy","Saving…");
  clearTimeout(timer); timer=setTimeout(flush,1200);
}
async function flush(){
  if(!docRef||writing||!dirty) return;
  writing=true; dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(P)));setSync("on","Synced to your account")}
  catch(e){if(e&&e.code==="unavailable"){dirty=true;setTimeout(flush,1500+Math.random()*1500)}else setSync("","Not synced — saved on this device")}
  writing=false; if(dirty) flush();
}
function packsCol(){return DB&&UID?DB.collection("data/users/"+UID):null}
async function initRuntime(){
  if(!window.claude||!window.claude.use) return;
  claude.use("sample").then(async s=>{SAMPLE=s;if(s){try{LIMITS=await s.limits()}catch(e){LIMITS=null}} if(view.name==="import")render()});
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    DB=db; UID=uid; docRef=db.doc("data/users/"+uid+"/progress");
    setSync("busy","Syncing…");
    const snap=await docRef.get();
    if(snap.exists){P=merge(P,snap.data());persistLocal()}
    dirty=true; await flush();
    // packs: union of remote + local-only
    try{
      const qs=await packsCol().get();
      const all=qs.docs.filter(d=>d.id.startsWith("pack-"));
      for(const d of all){if(P.gone[d.id]){try{await packsCol().doc(d.id).delete()}catch(e){}}}
      const remote=all.filter(d=>!P.gone[d.id]).map(d=>d.data());
      const ids=new Set(remote.map(p=>p.id));
      const localOnly=PACKS.filter(p=>!ids.has(p.id));
      for(const p of localOnly){try{await packsCol().doc(p.id).set(p)}catch(e){}}
      PACKS=[...remote.map(p=>JSON.parse(JSON.stringify(p))),...localOnly]; persistPacks();
    }catch(e){}
    docRef.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites) return;
      const d=s.data(); if((d.updated||0)<=P.updated) return;
      P=merge(P,d); persistLocal(); PACKS=PACKS.filter(p=>!P.gone[p.id]); persistPacks(); setSync("on","Synced to your account"); updateTop();
      if(view.name==="home") render();
    },()=>setSync("","Not synced — saved on this device"));
    updateTop(); if(view.name==="home"||view.name==="unit") render();
  }catch(e){docRef=null;setSync("","Saved on this device only")}
}

/* ============ CONTENT ACCESS ============ */
function customUnit(p){return {id:p.id,code:"MY SLIDES",title:p.title,assess:"Imported slides",exam:false,course:COURSE[p.courseId]||COURSES[0],notes:[],cards:[],quiz:[],exam:[],custom:p}}
function isTopic(p){return !p.unitId||(!BASE[p.unitId]&&!PACKS.some(x=>x.id===p.unitId))}
function unitsOf(c){return [...c.units,...PACKS.filter(p=>isTopic(p)&&p.courseId===c.id).map(customUnit)]}
function allUnits(){return COURSES.flatMap(unitsOf)}
function getUnit(id){if(BASE[id])return BASE[id];const p=PACKS.find(x=>x.id===id&&isTopic(x));return p?customUnit(p):null}
function sources(u){
  const list=[]; if(!u.custom) list.push({id:u.id,notes:u.notes,cards:u.cards,quiz:u.quiz,exam:u.exam});
  (u.custom?[u.custom,...PACKS.filter(p=>p.unitId===u.id)]:PACKS.filter(p=>p.unitId===u.id)).forEach(p=>list.push({id:p.id,pack:p,notes:p.notes||[],cards:p.cards||[],quiz:p.quiz||[],exam:p.exam||[]}));
  return list;
}
function cardsOf(u){const out=[];sources(u).forEach(s=>s.cards.forEach((c,i)=>out.push({k:s.id+":"+i,f:c[0],b:c[1],u,pack:s.pack})));return out}
function quizOf(u){return sources(u).flatMap(s=>s.quiz)}
function examOf(u){const out=[];sources(u).forEach(s=>s.exam.forEach((e,i)=>out.push(Object.assign({},e,{k:s.id+":"+i,pack:s.pack}))));return out}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="kt">$1</b>').replace(/`([^`]+)`/g,"<code>$1</code>")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isDue(k){const r=P.cards[k];return !r||r.d<=Date.now()}
function unitStats(u){
  const cs=cardsOf(u);let mastered=0,due=0;
  cs.forEach(c=>{const r=P.cards[c.k];if(r&&r.b>=3)mastered++;if(isDue(c.k))due++});
  return {mastered,due,total:cs.length,pct:cs.length?Math.round(mastered/cs.length*100):0,quiz:P.quiz[u.id]};
}
function allDue(){return allUnits().flatMap(u=>cardsOf(u).filter(c=>isDue(c.k)))}
function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addXP(n){if(!n)return;const k=dayKey();P.days[k]=(P.days[k]||0)+n;toast("+"+n+" XP")}
function totalXP(){return Object.values(P.days).reduce((a,b)=>a+b,0)}
function streak(){let n=0;const d=new Date();if(!P.days[dayKey(d)])d.setDate(d.getDate()-1);while(P.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function levelInfo(){const x=totalXP(),L=Math.floor(Math.sqrt(x/25))+1,lo=25*(L-1)**2,hi=25*L*L;return {x,L,toNext:hi-x,pct:Math.round((x-lo)/(hi-lo)*100)}}
function updateTop(){const li=levelInfo();$("#streakPill").textContent="🔥 "+streak();$("#xpPill").textContent="⚡ Lv "+li.L}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1100)}
function rateCard(c,ok){

function cardQuestions(u,n){
  const cs=cardsOf(u);if(cs.length<4)return [];
  let pool=cs;if(pool.length<4)pool=u.course.units.flatMap(cardsOf);
  return shuffle(cs).slice(0,n).map(c=>{
    const others=shuffle(pool.filter(o=>o.k!==c.k));
    const termFirst=!/^[\d−(-]/.test(c.f)&&c.f.length<45&&Math.random()<.5;
    if(termFirst){
      const ds=others.map(o=>o.f).filter(f=>f!==c.f).slice(0,3);
      return {k:"gen:"+hashStr("t"+c.k),raw:[`Which term matches this?\n“${c.b}”`,[c.f,...ds],0,`${c.f}: ${c.b}`]};
    }
    const ds=others.map(o=>o.b).filter(b=>b!==c.b).slice(0,3);
    return {k:"gen:"+hashStr("d"+c.k),raw:[c.f+(/[?…]$/.test(c.f)?"":" — which is right?"),[c.b,...ds],0,`${c.f}: ${c.b}`]};
  }).filter(q=>q.raw[1].length===4);
}
function bankQuestions(u){const out=[];sources(u).forEach(s=>s.quiz.forEach((q,i)=>out.push({k:"bank:"+s.id+":"+i,raw:q})));return out}
function buildQuiz(u,total=12){
  const gens=MATHGEN[u.id]||[],out=[],stems=new Set();
  const add=q=>{if(q&&!stems.has(q.raw[0])&&out.length<total){stems.add(q.raw[0]);out.push(q)}};
  if(gens.length){
    shuffle(gens).concat(shuffle(gens)).slice(0,6).forEach(g=>{try{const raw=g();add({k:"gen:"+hashStr(raw[0]),raw})}catch(e){}});
    shuffle(bankQuestions(u)).slice(0,3).forEach(add);
  }else shuffle(bankQuestions(u)).slice(0,6).forEach(add);
  cardQuestions(u,total).forEach(add);
  shuffle(bankQuestions(u)).forEach(add);
  return shuffle(out).map(q=>({...q,u:u.id}));
}

}

function quizSession(el,S,onExit){
  if(S.pos>=S.qs.length){
    const pct=S.qs.length?Math.round(S.score/S.qs.length*100):0,left=S.qs.length-S.score;
    if(!S.saved){S.saved=true;
      if(S.mode==="quiz"){const old=P.quiz[S.unit]||{best:0,n:0};P.quiz[S.unit]={best:Math.max(old.best,pct),last:pct,n:old.n+1,t:Date.now()};S.newBest=pct>old.best&&old.n>0}
      save();if(pct>=70)confetti()}
    el.innerHTML=S.mode==="quiz"
      ?`<div class="done"><div class="big">${pct}%</div><p>${S.score} of ${S.qs.length} correct${S.newBest?" · new best 🎉":""}</p>${left?`<p>${left} question${left>1?"s":""} added to <b>Mistakes</b>.</p>`:""}
        <div class="row center"><button class="btn" id="again">New quiz</button>${left?`<button class="btn" id="fix" style="--c:var(--bad)">Fix mistakes now</button>`:""}<button class="btn ghost" id="back">Done</button></div></div>`
      :`<div class="done"><div class="big">${S.score}/${S.qs.length}</div><p>mistakes fixed${left?` · ${left} still to fix`:" · all cleared 🎉"}</p>
        <div class="row center">${left?`<button class="btn" id="fix" style="--c:var(--bad)">Go again</button>`:""}<button class="btn ghost" id="back">Done</button></div></div>`;
    $("#back").onclick=onExit;
    const ag=$("#again");if(ag)ag.onclick=()=>{const u=getUnit(S.unit);Object.assign(S,{qs:toSession(buildQuiz(u)),pos:0,score:0,picked:null,combo:0,saved:false});quizSession(el,S,onExit)};
    const fx=$("#fix");if(fx)fx.onclick=()=>{const w=S.unit&&S.mode==="quiz"?liveWrong(S.unit):view.name==="mistakes"?liveWrong():liveWrong(view.id);
      Object.assign(S,{mode:"mistakes",qs:toSession(shuffle(w).slice(0,20)),pos:0,score:0,picked:null,combo:0,saved:false});quizSession(el,S,onExit)};
    return;
  }
  const q=S.qs[S.pos],L="ABCDEF",qu=getUnit(q.u);
  if(view.name==="mistakes"&&qu)setC(qu);
  el.innerHTML=`<div class="q"><div class="fc-top"><span class="count">${S.mode==="mistakes"?"❌ ":""}Q${S.pos+1} / ${S.qs.length}</span><span class="track"><i style="width:${Math.round(S.pos/S.qs.length*100)}%"></i></span><span class="combo">${S.combo>=2?"🔥 "+S.combo+" in a row":view.name==="mistakes"&&qu?esc(qu.code):""}</span></div>
  <p class="stem">${esc(q.s).replace(/\n/g,"<br>")}</p>
  <div class="opts">${q.o.map((o,j)=>{let cls="";if(S.picked!==null){if(o.c)cls="right";else if(j===S.picked)cls="wrong"}
    return `<button class="opt ${cls}" data-j="${j}" ${S.picked!==null?"disabled":""}><span class="k">${L[j]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
  ${S.picked!==null?`<div class="explain">${q.o[S.picked].c?(S.mode==="mistakes"?"<b>Fixed ✓</b>":"<b>Correct.</b>"):"<b class=\"x\">Not quite.</b>"} ${esc(q.e||"")}${!q.o[S.picked].c?`<br><span class="status">Saved to Mistakes</span>`:""}</div><div class="qnav"><button class="btn" id="nx">${S.pos+1<S.qs.length?"Next →":"See score"}</button></div>`:""}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.picked=+b.dataset.j;const ok=q.o[S.picked].c;recordAnswer(q,ok);
    if(ok){S.score++;S.combo++;addXP(S.mode==="mistakes"?8:5)}else S.combo=0;save();quizSession(el,S,onExit)});
  const nx=$("#nx");if(nx){nx.onclick=()=>{S.pos++;S.picked=null;quizSession(el,S,onExit)};nx.focus({preventScroll:true})}
}
